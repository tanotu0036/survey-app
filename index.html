// ---- 職員: シフト希望の提出画面(1日に1つだけ選ぶ。同じボタンをもう一度押すと取り消し) ----
function staffShift(sh) {
  S.st.notice = '';
  const choice = Object.assign({}, sh.mine ? sh.mine.choices : {});
  const note = h('textarea', { maxlength: '1000', placeholder: '例: 半休は2番希望 / 3日は午前のみ出勤できます', value: sh.mine ? sh.mine.note : '' });
  const box = h('div');
  const count = h('div', { class: 'sub', style: 'margin-top:8px' });
  const dKey = 'draft:s:' + S.st.staffId + ':' + sh.shiftId;
  const dLabel = h('div', { class: 'draft' });
  const save = draftSaver(dKey, () => ({ choices: choice, note: note.value }), dLabel);
  S.flush = save.flush;
  const draft = draftLoad(dKey);
  let dNote = null;
  if (draft) {
    Object.keys(choice).forEach(k => { delete choice[k]; });
    Object.assign(choice, draft.v.choices || {});
    note.value = draft.v.note || '';
    dNote = h('div', { class: 'ok' }, '前回の入力途中の内容(' + fmtTime(draft.t) + ' 保存)を復元しました。まだ提出されていません。',
      h('div', { style: 'margin-top:6px' }, h('button', { class: 'ghost small', onclick: () => {
        if (!confirm('入力途中の内容を消して、' + (sh.mine ? '提出済みの内容' : '最初の状態') + 'に戻します。よろしいですか?')) return;
        save.cancel(); lsDel(dKey); staffShift(sh);
      } }, '下書きを消す')));
  }
  function updCount() {
    const ids = Object.values(choice);
    count.replaceChildren(...(ids.length
      ? ['選んだ日: ' + ids.length + '日 ', shiftCountChips(sh.options, ids)]
      : ['まだ選んでいません(希望がなければ、何も選ばずに提出してください)']));
  }
  const rows = sh.days.map(d => {
    const lab = h('div', { class: 'dl' }, shiftDayLabel(sh.month, d), !d.closed && d.note ? h('div', { class: 'ev' }, d.note) : null);
    if (d.closed) return h('div', { class: 'sday closed' }, lab, h('div', { class: 'sub' }, '休園日' + (d.note ? '(' + d.note + ')' : '')));
    // 4文字以上は真ん中で折り返す(「午前半休」→「午前/半休」)
    const btns = sh.options.map(o => h('button', { class: 'sopt', type: 'button' },
      o.label.length >= 4 ? [o.label.slice(0, Math.ceil(o.label.length / 2)), h('wbr'), o.label.slice(Math.ceil(o.label.length / 2))] : o.label));
    const row = h('div', { class: 'sday' }, lab, h('div', { class: 'sopts', style: '--n:' + sh.options.length }, btns));
    // 選んだボタンは選択肢の色で塗る。選んでいないボタンは文字だけその色にする
    function paint() {
      btns.forEach((b, i) => {
        const on = choice[d.d] === sh.options[i].id, c = shiftColor(sh.options[i], i);
        b.classList.toggle('on', on);
        b.style.cssText = on ? shiftColorStyle(c) : 'color:' + c.ink;
      });
      row.classList.toggle('chosen', !!choice[d.d]);
    }
    btns.forEach((b, i) => b.addEventListener('click', () => {
      const id = sh.options[i].id;
      if (choice[d.d] === id) delete choice[d.d]; else choice[d.d] = id;
      paint(); updCount(); save();
    }));
    paint();
    return row;
  });
  updCount();
  const btn = h('button', { class: 'block' }, sh.mine ? '修正して提出する' : '提出する');
  btn.addEventListener('click', () => {
    setMsg(box, null);
    save.cancel(); draftSave(dKey, { choices: choice, note: note.value });   // 送信に失敗しても入力が残るように
    withBusy(btn, call('staffSubmitShift', S.st.staffId, S.st.pin, sh.shiftId, choice, note.value).then(r => {
      lsDel(dKey);
      S.st.notice = '「' + sh.title + '」を提出しました。' + (sh.deadline ? fmtDate(sh.deadline) + 'までは' : '受付中は') + '何度でも修正できます。';
      staffLoadList();
    }).catch(e => setMsg(box, errBox(e.message))));
  });
  show(h('div', { class: 'row between' }, h('span', { class: 'tag lav' }, 'シフト希望'),
      h('button', { class: 'ghost small', onclick: () => { save.flush(); staffList(); } }, '一覧に戻る')),
    h('h1', {}, sh.title),
    h('div', { class: 'sub' }, '対象: ' + shiftMonthLabel(sh.month) + (sh.deadline ? ' / 提出期限: ' + fmtDate(sh.deadline) : '')),
    sh.description ? h('div', { class: 'qnote sub-of', style: 'margin:10px 0' }, sh.description) : null,
    sh.mine ? h('div', { class: 'ok' }, '提出済みです(' + fmtMDHM(sh.mine.updatedAt) + ')。直したいときは、選び直して「修正して提出する」を押してください。') : null,
    dNote,
    h('div', { class: 'card scard' },
      h('div', { class: 'sub', style: 'margin-bottom:6px' }, '希望がある日だけ、1つ選んでください。同じボタンをもう一度押すと取り消せます。'),
      rows, count),
    h('div', { class: 'card' }, h('label', { class: 'f', style: 'margin-top:0' }, 'その他希望・連絡'), note),
    box, btn, dLabel,
    h('div', { class: 'note' }, DEVICE_NOTICE));
  note.addEventListener('input', save);
}

// ---- 園長: シフト希望タブ(一覧) ----
function adminShifts(body) {
  const box = h('div');
  const listBox = h('div', {}, h('div', { class: 'sub' }, '読み込み中…'));
  body.append(h('div', { class: 'row between' }, h('h2', { style: 'margin:0' }, 'シフト希望一覧'),
      h('button', { onclick: () => shiftCreate() }, '+ シフト希望を作る')),
    h('div', { class: 'sub', style: 'margin:6px 0 0' }, '月を選ぶと、日付・曜日・祝日が自動で入ります。集まった希望は、Excelのシフト表にそのまま貼り付けられます。'),
    box, listBox);
  if (S.ad.notice) { setMsg(box, h('div', { class: 'ok' }, S.ad.notice)); S.ad.notice = ''; }
  call('adminGetShifts', S.ad.cred).then(list => {
    S.ad.shiftList = list;   // 新しく作るときに、前回の説明・選択肢を引き継ぐため
    if (!list.length) return listBox.replaceChildren(h('div', { class: 'card sub' }, 'まだシフト希望がありません。上のボタンから作りましょう。'));
    archiveTabs(listBox, list, x => !x.open, 'shifts', x => h('div', { class: 'card' },
      h('div', {}, h('span', { class: 'tag ' + (x.open ? '' : 'warn') }, x.open ? '受付中' : '受付終了')),
      h('h2', { style: 'margin-top:6px' }, x.title),
      h('div', { class: 'sub' }, '対象: ' + shiftMonthLabel(x.month) + ' / 提出期限: ' + fmtDate(x.deadline)),
      h('div', { class: 'prog' }, h('div', { class: 'bar' }, h('i', { style: 'width:' + (x.target ? Math.round(x.done * 100 / x.target) : 0) + '%' })),
        h('span', {}, x.done + '/' + x.target + '人 提出済み')),
      h('div', { class: 'row', style: 'margin-top:10px' },
        h('button', { class: 'small', onclick: () => shiftDetail(x.shiftId) }, '集計・Excelに貼る'),
        h('button', { class: 'ghost small', onclick: () => shiftShareText(x) }, 'Chatwork用の依頼文'),
        h('button', { class: 'ghost small', onclick: () => shiftCreate(x) }, '内容を修正'),
        h('button', { class: 'ghost small', onclick: () => {
          call('adminSetShiftStatus', S.ad.cred, x.shiftId, x.status === 'open' ? 'closed' : 'open').then(adminMain).catch(e => setMsg(box, errBox(e.message)));
        } }, x.status === 'open' ? '受付を締め切る' : '受付を再開'),
        h('button', { class: 'danger small', onclick: () => {
          if (!confirm('「' + x.title + '」と、提出されたシフト希望をすべて削除します。元に戻せません。よろしいですか?')) return;
          call('adminDeleteShift', S.ad.cred, x.shiftId).then(adminMain).catch(e => setMsg(box, errBox(e.message)));
        } }, '削除'))));
  }).catch(e => setMsg(box, errBox(e.message)));
}

function shiftShareText(x, after) {
  const text = '【シフト希望の提出のお願い】\n' + x.title + '\n'
    + (x.deadline ? '提出期限: ' + fmtDate(x.deadline) + '\n' : '')
    + '\n▼提出はこちら\n' + BOOT.baseUrl + '\n\n'
    + '園と名前を選び、PIN(4桁)を入力すると、ログイン後の画面に「シフト希望」が出ます。\n'
    + '※提出期限までは、何度でも修正できます。\n' + DEVICE_NOTICE;
  show(h('button', { class: 'ghost small', onclick: after || adminMain }, '← 戻る'), h('h1', {}, 'Chatwork用の依頼文'),
    h('div', { class: 'card' }, copyBox(text, 'コピー'), h('div', { class: 'sub', style: 'margin-top:8px' }, 'Chatworkのグループチャットに貼り付けて送信してください。')));
}

// ---- 園長: シフト希望の作成・修正(edit: 一覧の1件。修正のとき対象の月は変えない) ----
function shiftCreate(edit) {
  S.ad.tab = 'shifts';
  const tpl = edit || (S.ad.shiftList && S.ad.shiftList[0]) || null;   // 新規は前回のものを引き継ぐ
  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const nx = new Date(now.getFullYear(), now.getMonth() + 1, 1);   // 新規の初期値は来月
  const ySel = h('select', { disabled: !!edit }), mSel = h('select', { disabled: !!edit });
  for (let y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) ySel.append(h('option', { value: String(y) }, y + '年'));
  for (let m = 1; m <= 12; m++) mSel.append(h('option', { value: pad(m) }, m + '月'));
  const curMonth = edit ? edit.month : nx.getFullYear() + '-' + pad(nx.getMonth() + 1);
  ySel.value = curMonth.slice(0, 4); mSel.value = curMonth.slice(5, 7);
  const month = () => ySel.value + '-' + mSel.value;
  const title = h('input', { type: 'text', maxlength: '100', value: edit ? edit.title : '' });
  let titleTouched = !!edit;
  title.addEventListener('input', () => { titleTouched = true; });
  const desc = h('textarea', { style: 'min-height:160px', value: tpl ? tpl.description : SHIFT_DEFAULT_DESC });
  const deadline = h('input', { type: 'date', value: edit ? edit.deadline : '' });
  let deadlineTouched = !!edit;
  deadline.addEventListener('input', () => { deadlineTouched = true; });
  const box = h('div');

  // ---- 対象の職員(休業中などで今月は出さない人のチェックを外す) ----
  // 初期値: 修正はそのシフト希望の対象外、新規は前回のシフト希望の対象外を外した状態
  const exInit = new Set((tpl && tpl.exclude) || []);
  let tgtPicks = [];
  const tgtCount = h('span', { class: 'sub' });
  const tgtList = h('div', {}, h('div', { class: 'sub' }, '読み込み中…'));
  const updTgt = () => { tgtCount.textContent = tgtPicks.filter(p => p.cb.checked).length + ' / ' + tgtPicks.length + '人を対象にしています'; };
  call('adminGetStaff', S.ad.cred).then(list => {
    tgtPicks = list.filter(s => s.active).map(s => ({ s: s, cb: h('input', { type: 'checkbox', checked: !exInit.has(s.staffId), onchange: updTgt }) }));
    tgtList.replaceChildren(...(tgtPicks.length ? tgtPicks.map(p => h('label', { class: 'opt' }, p.cb, h('span', {}, p.s.name)))
      : [h('div', { class: 'err' }, '職員が登録されていません。先に「職員」タブで登録してください。')]));
    updTgt();
  }).catch(e => tgtList.replaceChildren(errBox(e.message)));

  // ---- 選択肢(ボタンの文字・Excelに入れる記号・色) ----
  const optBox = h('div');
  const opts = [];
  function addOpt(o) {
    const label = h('input', { type: 'text', maxlength: '20', placeholder: 'ボタンの文字(例: ×)', value: o.label || '' });
    const code = h('input', { type: 'text', maxlength: '10', placeholder: 'Excelの記号', value: o.code || '' });
    // 色: 決まっていなければ、まだ使っていない色を自動で選ぶ
    const usedColors = opts.map(x => x.color.value);
    const color = h('select', {}, Object.keys(SHIFT_COLORS).map(k => h('option', { value: k }, SHIFT_COLORS[k].name)));
    color.value = SHIFT_COLORS[o.color] ? o.color : (Object.keys(SHIFT_COLORS).find(k => usedColors.indexOf(k) < 0) || 'gray');
    const paint = () => { color.style.cssText = shiftColorStyle(SHIFT_COLORS[color.value]); };
    color.addEventListener('change', paint); paint();
    const x = { id: o.id || '', label: label, code: code, color: color };
    const el = h('div', { class: 'soptedit' }, label, code, color,
      h('button', { class: 'danger small', type: 'button', onclick: () => { opts.splice(opts.indexOf(x), 1); el.remove(); } }, '削除'));
    x.el = el; opts.push(x); optBox.append(el);
  }
  // 修正では id を残す(提出済みの選択とつながっている)。新規は前回の選択肢の文字・記号・色だけ引き継ぐ
  (tpl ? tpl.options : SHIFT_DEFAULT_OPTIONS).forEach((o, i) => addOpt(edit ? o
    : { label: o.label, code: o.code, color: o.color || Object.keys(SHIFT_COLORS)[i % 8] }));

  // ---- 日ごとの設定(休園日・行事) ----
  const dayBox = h('div');
  let days = edit ? edit.days.map(d => Object.assign({}, d)) : shiftGenDays(month());
  function drawDays() {
    dayBox.replaceChildren(...days.map(d => {
      const cb = h('input', { type: 'checkbox', checked: d.closed });
      const ev = h('input', { type: 'text', maxlength: '30', value: d.note });
      const row = h('div', { class: 'sdedit' + (d.closed ? ' closed' : '') },
        h('div', { class: 'dl', style: 'font-weight:600' }, shiftDayLabel(month(), d)),
        h('label', { style: 'font-size:13px;white-space:nowrap' }, cb, ' 休園日'), ev);
      cb.addEventListener('change', () => { d.closed = cb.checked; row.classList.toggle('closed', d.closed); });
      ev.addEventListener('input', () => { d.note = ev.value; });
      return row;
    }));
  }
  function autoFill() {
    const [y, m] = month().split('-').map(Number);
    if (!titleTouched) title.value = S.ad.title + ' シフト希望(' + m + '月分)';
    // 提出期限の初期値: 前の月の10日
    if (!deadlineTouched) { const p = new Date(y, m - 2, 10); deadline.value = p.getFullYear() + '-' + pad(p.getMonth() + 1) + '-' + pad(p.getDate()); }
  }
  // ---- 年末年始の休園日(12月・1月のときだけ出す) ----
  // 期間は毎回 年末 12/29〜12/31、年始 1/1〜1/3 から始める(暦によって毎年前後するので、変えた期間は覚えない)
  const NY_NOTE = '年末年始';
  const ny = { endFrom: 29, endTo: 31, startFrom: 1, startTo: 3 };
  const daySel = v => { const s = h('select', { style: 'width:auto;padding:6px 8px;font-size:14px' }); for (let i = 1; i <= 31; i++) s.append(h('option', { value: String(i) }, i + '日')); s.value = String(v); return s; };
  const nyFrom = daySel(1), nyTo = daySel(1);
  const nyLabel = h('b', { style: 'font-size:14px' });
  const nyBox = h('div', { class: 'row', style: 'margin:10px 0;font-size:14px' }, nyLabel, nyFrom, '〜', nyTo,
    h('span', { class: 'sub' }, '(この期間を休園日にします)'));
  const isEnd = () => Number(mSel.value) === 12;
  function showNy() {
    const m = Number(mSel.value);
    nyBox.style.display = m === 12 || m === 1 ? '' : 'none';
    nyLabel.textContent = (isEnd() ? '年末の休園日: 12月' : '年始の休園日: 1月');
    nyFrom.value = String(isEnd() ? ny.endFrom : ny.startFrom);
    nyTo.value = String(isEnd() ? ny.endTo : ny.startTo);
  }
  // 年末年始の休園日を入れ直す。前に年末年始として入れた日は、いったん元(日祝だけ休園日)に戻してから入れる
  function applyNy() {
    const m = Number(mSel.value);
    if (m !== 12 && m !== 1) return;
    const base = shiftGenDays(month());
    let a = Number(nyFrom.value), b = Number(nyTo.value);
    if (a > b) { const t = a; a = b; b = t; }
    days.forEach((d, i) => {
      if (d.note === NY_NOTE) { d.closed = base[i].closed; d.note = base[i].note; }
      if (d.d >= a && d.d <= b) { d.closed = true; if (!d.note) d.note = NY_NOTE; }
    });
    drawDays();
  }
  function onNyChange() {
    if (isEnd()) { ny.endFrom = Number(nyFrom.value); ny.endTo = Number(nyTo.value); }
    else { ny.startFrom = Number(nyFrom.value); ny.startTo = Number(nyTo.value); }
    applyNy();
  }
  nyFrom.addEventListener('change', onNyChange); nyTo.addEventListener('change', onNyChange);
  function onMonth() {
    days = shiftGenDays(month());
    autoFill(); showNy(); applyNy(); drawDays();
  }
  ySel.addEventListener('change', onMonth); mSel.addEventListener('change', onMonth);
  showNy();
  if (!edit) { autoFill(); applyNy(); }   // 新しく作るときは、12月・1月なら最初から年末年始を休園日にする
  drawDays();

  const saveBtn = h('button', { class: 'block' }, edit ? '修正を保存する' : '作成する');
  saveBtn.addEventListener('click', () => {
    setMsg(box, null);
    const x = {
      month: month(), title: title.value, description: desc.value, deadline: deadline.value,
      days: days.map(d => ({ d: d.d, closed: !!d.closed, note: String(d.note || '').trim() })),
      options: opts.map(o => ({ id: o.id, label: o.label.value.trim(), code: o.code.value.trim(), color: o.color.value })).filter(o => o.label),
    };
    // 職員の一覧が読めたときだけ送る(読めなかったら、GAS側で前の月と同じ対象外にする)
    if (tgtPicks.length) x.exclude = tgtPicks.filter(p => !p.cb.checked).map(p => p.s.staffId);
    if (tgtPicks.length && !tgtPicks.some(p => p.cb.checked)) return setMsg(box, errBox('対象の職員を1人以上選んでください。'));
    if (!x.title.trim()) return setMsg(box, errBox('タイトルを入力してください。'));
    if (!x.options.length) return setMsg(box, errBox('選択肢を1つ以上入れてください。'));
    if (!edit && (S.ad.shiftList || []).some(s => s.month === x.month)
      && !confirm(shiftMonthLabel(x.month) + 'のシフト希望はすでにあります。もう1つ作りますか?')) return;
    const p = edit ? call('adminUpdateShift', S.ad.cred, edit.shiftId, x) : call('adminCreateShift', S.ad.cred, x);
    withBusy(saveBtn, p.then(r => {
      S.ad.notice = '「' + x.title.trim() + '」を' + (edit ? '修正' : '作成') + 'しました。';
      if (edit) return adminMain();
      shiftShareText({ title: x.title.trim(), deadline: x.deadline, shiftId: r.shiftId }, adminMain);
    }).catch(e => setMsg(box, errBox(e.message))));
  });

  show(h('button', { class: 'ghost small', onclick: adminMain }, '← 戻る'),
    h('h1', {}, edit ? 'シフト希望を修正' : 'シフト希望を作る'),
    h('div', { class: 'card' },
      h('label', { class: 'f', style: 'margin-top:0' }, '対象の月' + (edit ? '(修正では変えられません)' : '')),
      h('div', { class: 'row', style: 'flex-wrap:nowrap' }, ySel, mSel),
      h('label', { class: 'f' }, 'タイトル'), title,
      h('label', { class: 'f' }, '提出期限(この日の終わりまで提出・修正できます)'), deadline,
      h('label', { class: 'f' }, '説明・ルール(職員の提出画面の上に出ます)'), desc),
    h('div', { class: 'card' },
      h('h2', {}, '対象の職員'),
      h('div', { class: 'sub' }, '休業中などで、この月のシフト希望を出さない人のチェックを外してください。外した人には提出のお願いが出ず、未提出の数やExcel用のコピーにも入りません(前の月で外した人は、最初から外れています)。'),
      h('div', { class: 'row', style: 'margin:10px 0' },
        h('button', { class: 'small', type: 'button', onclick: () => { tgtPicks.forEach(p => { p.cb.checked = true; }); updTgt(); } }, '全員を選択'), tgtCount),
      tgtList),
    h('div', { class: 'card' },
      h('h2', {}, '選択肢'),
      h('div', { class: 'sub' }, '左から、職員の画面のボタンの文字、Excelのシフト表に入れる記号(空ならボタンの文字をそのまま入れます)、色です。色は職員のボタンと集計の表で使います。'),
      edit ? h('div', { class: 'sub' }, 'すでに選んで提出した人がいる選択肢は消せません(文字や記号は変えられます)。') : null,
      optBox,
      h('button', { class: 'ghost small', type: 'button', onclick: () => addOpt({}) }, '+ 選択肢を追加')),
    h('div', { class: 'card' },
      h('h2', {}, '日付と休園日・行事'),
      h('div', { class: 'sub' }, '日曜日と祝日は、最初から休園日にしてあります。12月・1月は、下の期間で年末年始も休園日になります。ほかの日は「休園日」にチェックを入れてください。休園日の日は、職員は選べません(ピンクの行になります)。行事は職員の画面の日付の下に出ます。'),
      nyBox, dayBox),
    box, saveBtn);
}

// ---- 園長: 集計(Excelのシフト表に貼り付け・行の並べ替え・未提出者) ----
// notice: 読み直したあとに出すお知らせ(並べ替えで欄外を変えたときなど)
function shiftDetail(shiftId, notice) {
  S.ad.tab = 'shifts';
  const back = h('button', { class: 'ghost small', onclick: adminMain }, '← 戻る');
  show(back, h('div', { class: 'sub' }, '読み込み中…'));
  call('adminGetShift', S.ad.cred, shiftId).then(d => {
    const sh = d.shift;
    const people = d.people;   // 職員(提出状況・その他希望の一覧に使う)
    // 表・コピーの行: 職員と空行(産休中の先生の行や区切りの行など。記号のない行になる)を、保存した並び順どおりに並べる
    let bn = 0;
    const blankRow = label => ({ blank: true, key: 'b' + (++bn), label: label || '', name: '', choices: {}, note: '' });
    function buildRows(order) {
      const byId = {};
      people.forEach(p => { byId[p.staffId] = p; });
      const used = new Set(), out = [];
      (order || []).forEach(v => {
        if (v && typeof v === 'object') out.push(blankRow(v.b));
        else if (byId[v] && !used.has(v)) { used.add(v); out.push(byId[v]); }
      });
      people.forEach(p => { if (!used.has(p.staffId)) out.push(p); });   // 並び順にない職員(新しく入った人など)は下に
      return out;
    }
    let rows = buildRows(d.order);
    const rowKey = p => p.blank ? p.key : p.staffId;
    const optById = {};
    sh.options.forEach(o => { optById[o.id] = o; });
    const msg = h('div');
    if (notice) setMsg(msg, h('div', { class: 'ok' }, notice));
    const withName = h('input', { type: 'checkbox' });
    // その他希望・連絡を、1日の左の列(Excelのシフト表ではD列「希望」)に入れる
    const withNote = h('input', { type: 'checkbox', checked: true });
    const fillClosed = h('input', { type: 'checkbox', checked: true });
    const tblBox = h('div', { class: 'stbl' });
    const copyMsg = h('div', { class: 'sub', style: 'margin-top:6px' });
    const sortBox = h('div');
    const pendBox = h('div');
    const noteBox = h('div');

    function cell(p, day) {
      if (day.closed) return fillClosed.checked ? '休' : '';
      const id = p.choices[day.d];
      return id && optById[id] ? optById[id].code : '';
    }
    const colorOf = {};
    sh.options.forEach((o, i) => { colorOf[o.id] = shiftColor(o, i); });
    // 1人分の、選択肢ごとの日数(休園日の選択は数えない)
    function countsOf(p) {
      const ids = sh.days.filter(x => !x.closed).map(x => p.choices[x.d]).filter(id => id && optById[id]);
      return sh.options.map(o => ids.filter(id => id === o.id).length);
    }
    function drawTable() {
      // 名前のすぐ右に、選択肢ごとの日数(有給は何日か、などを横にスクロールせずに見られる)
      // 見出しの1行目だけ選択肢名を色付きで出す(2・3行目は空欄)
      const cntHead = first => sh.options.map(o => h('th', { class: 'cnt', style: first ? shiftColorStyle(colorOf[o.id]) : '' }, first ? o.label : ''));
      const head1 = h('tr', {}, h('th', { class: 'nm' }, '名前'), cntHead(true), sh.days.map(x => h('th', { class: x.closed ? 'cl' : '' }, x.d)));
      const head2 = h('tr', {}, h('th', { class: 'nm' }, ''), cntHead(false), sh.days.map(x => h('th', { class: x.closed ? 'cl' : '' }, shiftDayLabel(sh.month, x)[1])));
      const head3 = h('tr', {}, h('th', { class: 'nm sub' }, '行事'), cntHead(false), sh.days.map(x => h('th', { class: 'ev' + (x.closed ? ' cl' : '') }, x.closed ? '休' + (x.note ? ' ' + x.note : '') : x.note)));
      tblBox.replaceChildren(h('table', { class: 'shift' }, head1, head2, head3,
        rows.map(p => {
          if (p.blank) {
            return h('tr', { class: 'blankrow' },
              h('td', { class: 'nm' }, h('span', { class: 'sub' }, '(空行)' + (p.label ? ' ' + p.label : ''))),
              sh.options.map(() => h('td', { class: 'cnt' })),
              sh.days.map(x => h('td', { class: x.closed ? 'cl' : '' }, cell(p, x))));
          }
          const cn = countsOf(p);
          return h('tr', { class: p.submittedAt ? '' : 'pend' },
            h('td', { class: 'nm' }, p.name, p.submittedAt ? null : h('span', { class: 'tag warn', style: 'margin-left:4px' }, '未提出')),
            sh.options.map((o, j) => h('td', { class: 'cnt', style: cn[j] ? shiftColorStyle(colorOf[o.id]) : '' }, p.submittedAt ? cn[j] : '')),
            sh.days.map(x => {
              const v = cell(p, x), id = p.choices[x.d];
              return x.closed ? h('td', { class: 'cl' }, v)
                : h('td', { style: v && colorOf[id] ? shiftColorStyle(colorOf[id]) + ';font-weight:600' : '' }, v);
            }));
        })));
      // 全員分の合計(選択肢ごと)
      const all = [];
      people.forEach(p => sh.days.forEach(x => { const id = p.choices[x.d]; if (!x.closed && id && optById[id]) all.push(id); }));
      totalBox.replaceChildren('全員の合計: ', shiftCountChips(sh.options, all, true));
    }
    const totalBox = h('div', { class: 'sub', style: 'margin-top:10px' });
    // Excelに貼る形(タブ区切り)。行は並び順どおり、列は1日〜末日
    // 列の並び: (名前) → (その他希望・連絡) → 1日〜末日。
    // 改行やタブがあると貼り付けで行や列がずれるので、空白に置き換える
    function tsv() {
      return rows.map(p => (withName.checked ? [p.name] : []).concat(withNote.checked ? [p.note || ''] : [], sh.days.map(x => cell(p, x)))
        .map(v => String(v).replace(/[\t\r\n]+/g, ' ').trim()).join('\t')).join('\r\n');
    }
    // 貼り付けるときに選ぶセル(コピーした範囲の左上)
    function startCell() {
      return withName.checked ? '1人目の名前' : withNote.checked ? '1人目の希望(D列)' : '1人目の1日';
    }
    async function copyTable() {
      const text = tsv();
      try { await navigator.clipboard.writeText(text); }
      catch (e) {
        const ta = h('textarea', { style: 'position:fixed;top:0;left:0;opacity:0' });
        ta.value = text; document.body.append(ta); ta.select();
        try { document.execCommand('copy'); } catch (e2) { ta.remove(); return copyMsg.replaceChildren(errBox('コピーできませんでした。別のブラウザで試してください。')); }
        ta.remove();
      }
      const pend = people.filter(p => !p.submittedAt).length;
      const blanks = rows.length - people.length;
      copyMsg.replaceChildren(h('div', { class: 'ok' }, rows.length + '行(職員' + people.length + '人' + (blanks ? '・空行' + blanks + '行' : '') + ') × '
        + sh.days.length + '日分をコピーしました。Excelのシフト表で「'
        + startCell() + '」のセルを選んで、貼り付け(Ctrl+V)してください。'
        + (pend ? '(未提出の' + pend + '人は空欄です)' : '')));
    }
    withName.addEventListener('change', () => { setMsg(copyMsg, null); drawHint(); });
    withNote.addEventListener('change', () => { setMsg(copyMsg, null); drawHint(); });
    const hint = h('div', { class: 'sub', style: 'margin-top:4px' });
    function drawHint() {
      hint.textContent = 'コピーする列: ' + [withName.checked ? '名前' : '', withNote.checked ? 'その他希望・連絡' : '', '1日〜' + sh.days.length + '日']
        .filter(Boolean).join(' → ') + '。Excelでは「' + startCell() + '」のセルを選んで貼り付けます。'
        + (withName.checked && withNote.checked ? '(名前と希望が隣の列に入ります。間に職種などの列がある場合は、名前のチェックを外してください)' : '');
    }
    drawHint();
    fillClosed.addEventListener('change', () => { setMsg(copyMsg, null); drawTable(); });

    // ---- 行の並べ替え(このシフト希望だけの並び順。Excelのシフト表の行の順に合わせる) ----
    function openSort() {
      // 空行の名前はこの画面で直すので、行を写して使う(「やめる」を押したら元のまま)
      const order = rows.map(p => p.blank ? Object.assign({}, p) : p);
      // 欄外(この月は対象外): 休業中の先生など。提出のお願いを出さず、集計・コピーにも入れない
      const out = (d.excluded || []).slice();
      const outBox = h('div');
      function drawOut() {
        outBox.replaceChildren(h('div', { class: 'cdiv', style: 'margin-top:12px' }, '欄外(この月は対象外) ' + out.length + '人'),
          ...(out.length ? out.map((p, i) => h('div', { class: 'sortrow', style: 'cursor:default;color:#8b88a0' },
            h('span', { class: 'sortname' }, p.name),
            h('button', { class: 'ghost small', onclick: () => {
              out.splice(i, 1);
              // 戻した人は一番下に入る(必要ならドラッグで動かす)
              order.push(people.find(x => x.staffId === p.staffId) || { staffId: p.staffId, name: p.name, submittedAt: '', choices: {}, note: '' });
              draw(); drawOut();
            } }, '戻す')))
            : [h('div', { class: 'sub', style: 'padding:6px 4px' }, 'いません。休業中などで今月は対象外にする人は、上の「欄外へ」を押してください。')]));
      }
      const wrap = h('div');
      const save = h('button', { class: 'small' }, 'この順番で保存');
      function move(i, dd) {
        const j = i + dd;
        if (j < 0 || j >= order.length) return;
        const t = order[i]; order[i] = order[j]; order[j] = t;
        draw();
      }
      function draw() {
        wrap.replaceChildren(...order.map((p, i) => {
          const name = p.blank
            ? h('span', { class: 'sortname row', style: 'flex-wrap:nowrap;gap:6px' }, h('span', { class: 'tag gray', style: 'white-space:nowrap;flex:none' }, '空行'),
                h('input', { type: 'text', maxlength: '30', placeholder: '名前(例: 産休中 ○○先生、区切り)', value: p.label,
                  style: 'padding:5px 8px;font-size:14px', oninput: e => { p.label = e.target.value; } }))
            : h('span', { class: 'sortname' }, p.name);
          const row = h('div', { class: 'sortrow' + (p.blank ? ' blank' : '') },
            h('span', { class: 'grip', 'aria-hidden': 'true' }, '⠿'),
            h('span', { class: 'sortno' }, String(i + 1)),
            name,
            p.blank ? h('button', { class: 'danger small', onclick: () => { order.splice(i, 1); draw(); }, 'aria-label': '空行を消す' }, '×')
              : h('button', { class: 'ghost small', onclick: () => { order.splice(i, 1); out.push({ staffId: p.staffId, name: p.name }); draw(); drawOut(); } }, '欄外へ'),
            h('button', { class: 'ghost small', disabled: i === 0, onclick: () => move(i, -1), 'aria-label': '上へ' }, '▲'),
            h('button', { class: 'ghost small', disabled: i === order.length - 1, onclick: () => move(i, 1), 'aria-label': '下へ' }, '▼'));
          row.dataset.id = rowKey(p);
          row.addEventListener('pointerdown', e => sortDrag(e, row, wrap, () => {
            const ids = [...wrap.children].map(r => r.dataset.id);
            order.sort((a, b) => ids.indexOf(rowKey(a)) - ids.indexOf(rowKey(b)));
            draw();
          }));
          return row;
        }));
      }
      const addBlank = h('button', { class: 'ghost small', onclick: () => {
        order.push(blankRow(''));
        draw();
        const inputs = wrap.querySelectorAll('input');
        if (inputs.length) inputs[inputs.length - 1].focus();
      } }, '+ 空行を追加');
      save.addEventListener('click', () => {
        withBusy(save, call('adminSetShiftOrder', S.ad.cred, sh.shiftId, order.map(p => p.blank ? { b: p.label.trim() } : p.staffId), out.map(p => p.staffId)).then(() => {
          // 欄外を変えたときは、未提出の人数などが変わるので読み直す
          const before = (d.excluded || []).map(p => p.staffId).sort().join(), after = out.map(p => p.staffId).sort().join();
          if (before !== after) return shiftDetail(sh.shiftId, '行の並び順と欄外(対象外)を保存しました。次に作るシフト希望も、この並びと対象外を引き継ぎます。');
          rows = order;
          sortBox.replaceChildren();
          setMsg(msg, h('div', { class: 'ok' }, '行の並び順を保存しました。次に作るシフト希望も、この並びを引き継ぎます。'));
          drawTable(); setMsg(copyMsg, null);
        }).catch(e => setMsg(msg, errBox(e.message))));
      });
      draw(); drawOut();
      sortBox.replaceChildren(h('div', { class: 'card' },
        h('h2', {}, '行の並べ替え'),
        h('div', { class: 'sub', style: 'margin-bottom:8px' }, 'Excelのシフト表の行と同じ順に並べてください。名前をドラッグして動かします(スマホは左の ⠿ をつかみます。▲▼でも動かせます)。この並びは、このシフト希望だけのものです(職員一覧の並びは変わりません)。'),
        h('div', { class: 'sub', style: 'margin-bottom:8px' }, '産休中の先生の行や区切りの行など、Excelにあってアプリにいない行は「+ 空行を追加」で入れてください。空行は記号のない行としてコピーされます。'),
        h('div', { class: 'sub', style: 'margin-bottom:8px' }, '休業中などでこの月は対象外にする人は「欄外へ」を押します。提出のお願いが出なくなり、未提出の数やコピーにも入りません。Excelにその人の行があるときは、同じ位置に空行を入れてください。'),
        wrap,
        h('div', { style: 'margin-top:8px' }, addBlank),
        outBox,
        h('div', { class: 'row', style: 'margin-top:10px' }, save, h('button', { class: 'ghost small', onclick: () => sortBox.replaceChildren() }, 'やめる'))));
      sortBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ---- 未提出者と催促文、その他希望・連絡 ----
    const pend = people.filter(p => !p.submittedAt);
    if (pend.length) {
      const text = '【シフト希望の提出のお願い】\n' + sh.title + '\n' + (sh.deadline ? '提出期限: ' + fmtDate(sh.deadline) + '\n' : '')
        + '\nまだ提出していない方がいます。お手数ですが、提出をお願いします。\n\n未提出:\n' + pend.map(p => p.name).join('、')
        + '\n\n▼提出はこちら\n' + BOOT.baseUrl + '\n\n' + DEVICE_NOTICE;
      pendBox.append(h('div', { class: 'card' }, h('h2', {}, '未提出 ' + pend.length + '人'),
        h('div', { class: 'chips' }, pend.map(p => h('span', { class: 'chip' }, p.name))),
        h('div', { style: 'margin-top:12px' }, h('b', {}, 'Chatwork用の催促文'), copyBox(text, 'コピー'))));
    } else {
      pendBox.append(h('div', { class: 'ok' }, '全員が提出しました。'));
    }
    const notes = people.filter(p => String(p.note || '').trim());
    noteBox.append(h('div', { class: 'card' }, h('h2', {}, 'その他希望・連絡(' + notes.length + '人)'),
      notes.length ? notes.map(p => h('div', { class: 'txt' }, h('div', { class: 'who' }, p.name), p.note)) : h('div', { class: 'sub' }, 'まだありません。')));

    const doneN = people.length - pend.length;
    show(back,
      h('div', { style: 'margin-top:8px' }, h('span', { class: 'tag lav' }, 'シフト希望'), h('span', { class: 'tag ' + (sh.open ? '' : 'warn') }, sh.open ? '受付中' : '受付終了')),
      h('h1', {}, sh.title),
      h('div', { class: 'sub' }, '対象: ' + shiftMonthLabel(sh.month) + ' / 提出期限: ' + fmtDate(sh.deadline)),
      h('div', { class: 'prog' }, h('div', { class: 'bar' }, h('i', { style: 'width:' + (people.length ? Math.round(doneN * 100 / people.length) : 0) + '%' })),
        h('span', {}, doneN + '/' + people.length + '人 提出済み')),
      msg,
      h('div', { class: 'card' },
        h('div', { class: 'row between' }, h('h2', { style: 'margin:0' }, 'Excelのシフト表に貼る'),
          h('button', { class: 'ghost small', onclick: openSort }, '行の並べ替え')),
        h('div', { class: 'sub', style: 'margin-top:4px' }, '下の表の順(上から)で、1日〜' + sh.days.length + '日の記号をコピーします。行の順がExcelと違うときは「行の並べ替え」で合わせてください。'),
        h('div', { class: 'row', style: 'margin-top:8px;gap:16px;font-size:14px' },
          h('label', {}, fillClosed, ' 休園日に「休」を入れる'),
          h('label', {}, withNote, ' その他希望・連絡も含める'),
          h('label', {}, withName, ' 名前の列も含める')),
        hint,
        h('button', { class: 'block', onclick: copyTable }, '表をコピー(Excelに貼り付け用)'),
        copyMsg,
        h('div', { class: 'note' }, '貼り付けると、その範囲のセルは上書きされます(空欄の日も空欄で上書きされます)。勤務を入れる前に貼り付けてください。'),
        totalBox, tblBox,
        h('div', { class: 'sub', style: 'margin-top:6px' }, '名前の右の数字は、その人が選んだ日数です(コピーには含まれません)。')),
      sortBox, pendBox, noteBox);
    drawTable();
  }).catch(e => show(back, errBox(e.message)));
}

// 公開後に設問ごとの表示・非表示を切り替える(データは消さない)
function adminQuestionVisibility(v) {
  const back = h('button', { class: 'ghost small', onclick: adminMain }, '← 戻る');
  show(back, h('div', { class: 'sub' }, '読み込み中…'));
  call('adminGetResults', S.ad.cred, v.surveyId).then(r => {
    const qs = r.survey.questions;
    const box = h('div');
    const rows = qs.map(q => {
      const cb = h('input', { type: 'checkbox', checked: !q.hidden });
      const lab = h('label', { class: 'opt' }, cb, h('span', {}, q.text, dirTag(q), q.note ? h('div', { class: 'sub' }, q.note.length > 60 ? q.note.slice(0, 60) + '…' : q.note) : null));
      const paint = () => { lab.style.opacity = cb.checked ? '' : '.5'; };
      cb.addEventListener('change', paint); paint();
      return { q: q, cb: cb, lab: lab };
    });
    const saveBtn = h('button', { class: 'block' }, '保存する');
    saveBtn.addEventListener('click', () => {
      setMsg(box, null);
      if (rows.every(x => !x.cb.checked)) return setMsg(box, errBox('少なくとも1問は表示してください。'));
      const hiddenIds = rows.filter(x => !x.cb.checked).map(x => x.q.id);
      withBusy(saveBtn, call('adminSetHiddenQuestions', S.ad.cred, v.surveyId, hiddenIds).then(() => {
        setMsg(box, h('div', { class: 'ok' }, '保存しました。表示 ' + (rows.length - hiddenIds.length) + '問 / 非表示 ' + hiddenIds.length + '問'));
      }).catch(e => setMsg(box, errBox(e.message))));
    });
    show(back, h('h1', {}, '設問の表示・非表示'), h('div', { class: 'sub' }, v.title),
      h('div', { class: 'note' }, 'チェックを外した設問は、回答画面に出なくなり、結果画面・CSVからも外れます。すでに集まった回答は消えないので、チェックを付け直せば元に戻ります。'),
      h('div', { class: 'card' }, h('div', { class: 'row', style: 'margin-bottom:6px' },
        h('button', { class: 'ghost small', onclick: () => rows.forEach(x => { x.cb.checked = true; x.cb.dispatchEvent(new Event('change')); }) }, 'すべて表示')),
        rows.map(x => x.lab)),
      box, saveBtn);
  }).catch(e => show(back, errBox(e.message)));
}

function adminResults(surveyId) {
  show(h('button', { class: 'ghost small', onclick: adminMain }, '← 戻る'), h('div', { class: 'sub' }, '読み込み中…'));
  call('adminGetResults', S.ad.cred, surveyId).then(r => {
    const sv = r.survey;
    const qs = visibleQs(sv), nHidden = sv.questions.length - qs.length;
    const head = [
      h('button', { class: 'ghost small', onclick: adminMain }, '← 戻る'),
      h('div', { style: 'margin-top:8px' }, sv.all ? h('span', { class: 'tag lav' }, '全園共通') : null, audienceTag(sv),
        h('span', { class: 'tag' + (sv.anonymous ? '' : ' gray') }, sv.anonymous ? '無記名' : '記名'),
        h('span', { class: 'tag ' + (sv.open ? '' : 'warn') }, sv.open ? '受付中' : '受付終了')),
      h('h1', {}, sv.title),
      h('div', { class: 'sub' }, '回答 ' + r.count + '件 / 期限: ' + fmtDate(sv.deadline)),
      nHidden ? h('div', { class: 'note' }, '非表示の設問が' + nHidden + '問あります(結果・CSVには含めていません)。一覧の「設問の表示・非表示」から表示に戻せます。') : null,
    ];
    // CSV(全体分。全園共通では「園」の列が付く)
    if (!r.hidden) {
      const csv = resultsCsv(r);
      const fname = (sv.title.replace(/[\\/:*?"<>|.\s]+/g, '_').slice(0, 40) || 'アンケート') + '_結果.csv';
      const dlMsg = h('span', { class: 'sub' });
      head.push(h('div', { class: 'card' },
        h('div', { class: 'row' }, h('button', { class: 'small', onclick: () => {
          try { downloadCsv(fname, csv); dlMsg.textContent = 'ダウンロードしました(' + fname + ')'; }
          catch (e) { dlMsg.textContent = 'ダウンロードできませんでした。下の「コピー」を使ってください。'; }
        } }, 'CSVをダウンロード'), dlMsg),
        h('details', { style: 'margin-top:8px' }, h('summary', { class: 'sub' }, 'ダウンロードできない場合はこちら(コピーして貼り付け)'), copyBox(csv, 'CSVをコピー'))));
    }

    const view = h('div');
    // 全園共通: 「全園」と各園を切り替えて表示
    let tabBar = null;
    if (sv.all && r.groups) {
      const keys = [['', '全園']].concat(r.groups.map(g => [g.facilityId, g.name.replace('こども保育園', '')]));
      const btns = keys.map(k => h('button', { onclick: () => select(k[0]) }, k[1]));
      tabBar = h('div', { class: 'tabs' }, btns);
      function select(key) {
        btns.forEach((b, i) => { b.className = keys[i][0] === key ? 'on' : ''; });
        renderScope(key ? r.groups.find(g => g.facilityId === key) : null);
      }
      select('');
    } else {
      renderScope(null);
    }

    // g: null = 全体、それ以外は園ごとのデータ
    function renderScope(g) {
      const count = g ? g.count : r.count;
      const hidden = g ? g.hidden : r.hidden;
      const summary = g ? g.summary : r.summary;
      const nodes = [];
      if (g) nodes.push(h('div', { class: 'sub' }, g.name + 'の回答 ' + g.count + '件'));
      if (hidden) {
        nodes.push(h('div', { class: 'note' }, '無記名アンケートのため、' + (g ? 'この園の' : '') + '回答が' + r.minAnon + '件以上になるまで結果は表示されません(現在 ' + count + '件)。'));
      } else {
        // 記名のときだけ people がある(無記名は名前が送られてこない)
        const people = r.people ? (g ? r.people.filter(p => p.facility === g.name) : r.people) : null;
        qs.forEach((q, i) => nodes.push(questionCard(q, i, summary.find(x => x.id === q.id), count, people, !g)));
        if (people) {
          nodes.push(h('div', { class: 'card' }, h('h2', {}, '個人別の回答'),
            people.length === 0 ? h('div', { class: 'sub' }, 'まだ回答がありません。') :
            h('div', { style: 'overflow-x:auto' }, h('table', {},
              h('tr', {}, h('th', {}, '名前'), sv.all && !g ? h('th', {}, '園') : null, qs.map((q, i) => h('th', {}, (i + 1) + '. ' + q.text))),
              people.map(p => h('tr', {}, h('td', {}, p.name), sv.all && !g ? h('td', {}, p.facility.replace('こども保育園', '')) : null,
                qs.map(q => { const v = p.answers[q.id]; return h('td', {}, Array.isArray(v) ? v.join('、') : v); })))))));
        }
      }
      nodes.push(statusCard(g));
      view.replaceChildren(...nodes.filter(Boolean));
    }

    // people: 記名のときの回答者一覧(無記名は null) / showFac: 全園表示で園名を添えるか
    function questionCard(q, i, s, count, people, showFac) {
      const card = h('div', { class: 'card' }, h('div', { style: 'font-weight:600' }, (i + 1) + '. ' + q.text, dirTag(q)));
      // 無記名で回答が少ない園長だけの設問は、個人が特定されないように表示しない(GAS側で中身を送らない)
      if (s.few) {
        card.append(h('div', { class: 'note' }, '園長だけの設問で回答が' + r.minAnon + '件未満のため、無記名を守るために表示しません(現在 ' + s.n + '件)。'));
        return card;
      }
      if (q.type === 'text') {
        // 記名: 誰のアイデアか分かるように、回答ごとに名前(全園では園名も)を添える
        if (people) {
          const rows = people.filter(p => String(p.answers[q.id] || '').trim());
          if (!rows.length) card.append(h('div', { class: 'sub' }, '回答なし'));
          rows.forEach(p => card.append(h('div', { class: 'txt' },
            h('div', { class: 'who' }, p.name, showFac && sv.all && p.facility ? h('span', { class: 'sub' }, '(' + p.facility.replace('こども保育園', '') + ')') : null),
            p.answers[q.id])));
          return card;
        }
        if (!s.texts.length) card.append(h('div', { class: 'sub' }, '回答なし'));
        s.texts.forEach(t => card.append(h('div', { class: 'txt' }, t)));
        return card;
      }
      // 割合の分母: その設問に答えた人数(園長だけの設問は園長の人数)。古いデータで n がなければ回答件数
      const total = Math.max(s.n !== undefined ? s.n : count, 1);
      if (q.type === 'scale') {
        const n = q.options.reduce((a, o) => a + (s.counts[o] || 0), 0);
        const sum = q.options.reduce((a, o) => a + Number(o) * (s.counts[o] || 0), 0);
        card.append(h('div', { style: 'margin-top:6px' }, h('span', { class: 'sub' }, '平均 '),
          h('span', { class: 'avg' }, n ? (sum / n).toFixed(1) : '−'), h('span', { class: 'sub' }, ' / 5(' + n + '人が回答)')));
        if (q.low || q.high) card.append(h('div', { class: 'scale-ends' }, h('span', {}, '1: ' + (q.low || '')), h('span', {}, '5: ' + (q.high || ''))));
      }
      q.options.forEach(o => {
        const c = s.counts[o] || 0;
        const pct = Math.round(c * 100 / total);
        card.append(h('div', { class: 'bl' }, h('span', {}, o), h('span', {}, c + '人 (' + pct + '%)')),
          h('div', { class: 'bar' }, h('i', { style: 'width:' + pct + '%' })));
      });
      return card;
    }

    // 回答状況と催促文。全園では園ごとに分けて表示する
    function statusCard(g) {
      const groups = g ? [g] : (sv.all && r.groups ? r.groups : [{ name: '', completed: r.completed, notCompleted: r.notCompleted }]);
      const blocks = groups.map(x => {
        const people = x.notCompleted.map(n => ({ name: n, done: false })).concat(x.completed.map(n => ({ name: n, done: true })));
        return h('div', {}, (sv.all && !g) ? h('h3', {}, x.name) : null, statusGroups(people));
      });
      const pendLines = groups.filter(x => x.notCompleted.length).map(x => (sv.all ? x.name.replace('こども保育園', '') + ': ' : '') + x.notCompleted.join('、'));
      const reminder = '【アンケート回答のお願い】\n' + sv.title + '\n'
        + (sv.deadline ? '回答期限: ' + fmtDate(sv.deadline) + '\n' : '')
        + '\nまだ回答が届いていない方がいます。お手数ですが、ご回答をお願いします。\n'
        + '\n未回答:\n' + pendLines.join('\n') + '\n\n▼回答はこちら\n' + surveyUrl(sv.surveyId) + '\n\n' + DEVICE_NOTICE;
      return h('div', { class: 'card' }, h('h2', {}, '回答状況' + (g ? '(' + g.name + ')' : '')), blocks,
        sv.anonymous ? h('div', { class: 'sub', style: 'margin-top:8px' }, '無記名でも、回答済みかどうかは記録されるため確認できます(回答内容とは紐づきません)。') : null,
        pendLines.length ? h('div', { style: 'margin-top:12px' }, h('b', {}, 'Chatwork用の催促文'),
          sv.all && !g ? h('div', { class: 'sub' }, '園ごとのボタンに切り替えると、その園の未回答者だけの催促文になります。') : null,
          copyBox(reminder, 'コピー')) : null);
    }

    show(...head, tabBar, view);
  }).catch(e => show(h('button', { class: 'ghost small', onclick: adminMain }, '← 戻る'), errBox(e.message)));
}

// ---------- 版番号の表示 ----------
// 画面の一番下に「画面 ver / GAS ver」を出す。GASの版が古いまま(デプロイ忘れ)だと気付けるようにする
function showVersion() {
  const el = document.getElementById('ver');
  el.textContent = '画面 ver.' + APP_VERSION + ' / GAS ver.確認中…';
  call('getVersion').then(r => {
    el.textContent = '画面 ver.' + APP_VERSION + ' / GAS ver.' + r.version;
  }).catch(() => {
    el.replaceChildren('画面 ver.' + APP_VERSION + ' / ', h('span', { class: 'old' }, 'GAS ver.不明(GASが古い版のままの可能性があります)'));
  });
}
showVersion();

// ---------- 起動 ----------
// 画面を閉じる・アプリを切り替える直前に、保存待ちの下書きを保存する
window.addEventListener('pagehide', () => { if (S.flush) S.flush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.flush) S.flush(); });
if (BOOT.mode === 'admin') adminLogin(); else staffLogin();
</script>
