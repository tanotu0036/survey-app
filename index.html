<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>職員アンケート</title>
<style>
  :root {
    --bg:#fbf7fb; --card:#ffffff; --ink:#43405a; --sub:#8b88a0; --line:#ebe5f3;
    --main:#a9d8c8; --main-ink:#2d5f52; --main-line:#8fc9b6;
    --lav:#ddd6f7; --lav-ink:#4a3f85;
    --pink:#ffdfe0; --pink-ink:#a4404f; --pink-line:#f6b9bf;
    --peach:#ffe6d5; --peach-ink:#9a4f2c; --peach-line:#f7c4a5;
    --sky:#d9ecfa; --soft:#eef8f4;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:linear-gradient(180deg,#fdf4f8 0%,#f4f7fd 55%,#f2faf6 100%); background-attachment:fixed; color:var(--ink); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif; line-height:1.65; }
  #app { max-width:720px; margin:0 auto; padding:16px 16px 24px; }
  #ver { text-align:center; font-size:11px; color:#b3afc4; padding:0 16px 24px; }
  #ver .old { color:var(--pink-ink); }
  h1 { font-size:20px; margin:8px 0 4px; }
  h2 { font-size:17px; margin:0 0 8px; }
  h3 { font-size:15px; margin:16px 0 6px; }
  .sub { color:var(--sub); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin:14px 0; box-shadow:0 4px 14px rgba(150,130,190,.10); }
  label.f { display:block; font-weight:600; font-size:14px; margin:12px 0 4px; }
  input[type=text], input[type=password], input[type=date], input[type=tel], select, textarea {
    width:100%; padding:11px 13px; font-size:16px; border:1.5px solid var(--line); border-radius:12px; background:#fffefe; color:var(--ink); font-family:inherit;
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#bdb2ee; box-shadow:0 0 0 3px #ece8fb; }
  textarea { min-height:90px; resize:vertical; }
  button { font-family:inherit; font-size:16px; padding:11px 18px; border-radius:12px; border:1.5px solid var(--main-line); background:var(--main); color:var(--main-ink); font-weight:600; cursor:pointer; transition:filter .15s, transform .05s; }
  button:hover { filter:brightness(.97); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:#fff; color:var(--lav-ink); border-color:var(--lav); }
  button.ghost:hover { background:#f6f3fe; filter:none; }
  button.danger { background:#fff; color:var(--pink-ink); border-color:var(--pink-line); }
  button.danger:hover { background:var(--pink); filter:none; }
  button.small { font-size:13px; padding:6px 12px; border-radius:10px; }
  button.block { width:100%; margin-top:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row.between { justify-content:space-between; }
  .err { background:var(--pink); color:var(--pink-ink); border:1px solid var(--pink-line); border-radius:12px; padding:10px 14px; margin:12px 0; font-size:14px; }
  .ok { background:var(--soft); color:var(--main-ink); border:1px solid #cfe9df; border-radius:12px; padding:10px 14px; margin:12px 0; font-size:14px; }
  .note { background:#fff7e3; color:#7a6330; border:1px solid #f5e5b5; border-radius:12px; padding:10px 14px; font-size:13px; margin:12px 0; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border:1.5px solid var(--line); border-radius:12px; margin:6px 0; cursor:pointer; background:#fff; }
  .opt input { margin-top:5px; transform:scale(1.2); accent-color:#8fc9b6; }
  .opt:has(input:checked) { background:var(--soft); border-color:var(--main-line); }
  .req { color:var(--pink-ink); font-size:12px; margin-left:6px; }
  .tag { display:inline-block; font-size:12px; padding:2px 10px; border-radius:99px; background:var(--soft); color:var(--main-ink); margin-right:4px; font-weight:600; }
  .tag.gray { background:var(--sky); color:#3d6482; }
  .tag.warn { background:var(--pink); color:var(--pink-ink); }
  .tag.lav { background:var(--lav); color:var(--lav-ink); }
  .fprog { display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; margin-top:8px; font-size:13px; }
  .fprog .bar { height:10px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tabs { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
  .tabs button { background:#fff; color:var(--lav-ink); border-color:var(--lav); }
  .tabs button.on { background:var(--lav); color:var(--lav-ink); border-color:#c9bff0; }
  .bar { height:12px; background:#f0ecf7; border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#a9d8c8,#a8cff0); border-radius:99px; }
  .bl { display:flex; justify-content:space-between; font-size:14px; margin-top:8px; gap:8px; }
  .qbox { border:1.5px dashed #d9d0ec; border-radius:14px; padding:12px; margin:10px 0; background:#fdfcff; }
  .txt { background:#fbf9fe; border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin:6px 0; white-space:pre-wrap; font-size:14px; }
  .txt .who { font-size:12px; font-weight:600; color:#2f5878; white-space:normal; margin-bottom:2px; }
  .center { text-align:center; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { padding:3px 13px; border-radius:99px; font-size:14px; border:1px solid var(--peach-line); background:var(--peach); color:var(--peach-ink); }
  .chip.done { background:#f1f1f4; border-color:#e2e2e8; color:#a6a6b3; }
  .chip.me { font-weight:700; border-width:2px; }
  /* 回収メモ */
  .srow { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .srow-main { flex:1; min-width:0; }
  .srow-st { white-space:nowrap; margin-top:2px; }
  .srow-side { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .crow { display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; padding:10px 6px; border-bottom:1px solid var(--line); }
  .crow.got { background:#f6faf8; }
  .cchk { display:flex; align-items:center; gap:10px; cursor:pointer; min-width:0; }
  .cchk input { transform:scale(1.35); accent-color:#8fc9b6; }
  .cname { font-weight:600; }
  .crow.got .cname { color:#8a8a99; }
  .cstat { font-size:13px; color:var(--pink-ink); white-space:nowrap; }
  .crow.got .cstat { color:var(--main-ink); }
  .cmemo-wrap { grid-column:1 / -1; display:flex; align-items:center; gap:8px; }
  .cmemo { flex:1; padding:7px 10px !important; font-size:14px !important; }
  .cmemo-msg { white-space:nowrap; }
  .atabs { margin:12px 0 0; }
  .atabs button.on { background:var(--lav); color:var(--lav-ink); border-color:#c9bff0; }
  .cdiv { font-size:12px; font-weight:600; color:var(--sub); padding:12px 6px 4px; border-bottom:1px solid var(--line); }
  /* 職員の一覧の回答状況(H案) */
  .pills { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .pill { border-radius:99px; padding:1px 10px; font-size:12px; background:#f1f1f4; color:#7d7a8c; }
  .pill.pend { background:var(--peach); color:var(--peach-ink); }
  button.ptoggle { background:none; border:none; padding:4px 0; margin-top:4px; font-size:13px; font-weight:600; color:var(--lav-ink); }
  button.ptoggle:hover { filter:none; text-decoration:underline; }
  .pnames { border-top:1px solid var(--line); margin-top:4px; padding-top:8px; }
  .pgrp { font-size:12px; font-weight:600; color:var(--sub); margin-top:8px; }
  .pgrp.pend { color:var(--peach-ink); margin-top:0; }
  .plist { font-size:14px; }
  .plist.done { font-size:13px; color:var(--sub); }
  .pme { color:var(--peach-ink); }
  .sortrow { display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); }
  .sortno { width:2em; text-align:right; color:var(--sub); font-size:13px; }
  .sortname { flex:1; }
  .sortrow { cursor:grab; user-select:none; -webkit-user-select:none; background:#fff; }
  .sortrow.dragging { cursor:grabbing; background:#e3f0fb; border-radius:10px; box-shadow:0 4px 14px rgba(150,130,190,.25); position:relative; z-index:1; }
  .grip { touch-action:none; color:#a8a5b8; font-size:20px; line-height:1; padding:6px 8px; margin:-6px 0 -6px -4px; cursor:grab; }
  .grp { font-size:13px; font-weight:600; margin-top:12px; color:var(--ink); }
  .prog { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .prog .bar { flex:1; }
  .prog span { font-size:13px; color:var(--sub); white-space:nowrap; }
  /* 5段階評価 */
  .scale { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:8px; }
  .scale label { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0; border:1.5px solid var(--line); border-radius:12px; background:#fff; cursor:pointer; font-weight:600; }
  .scale label:has(input:checked) { background:var(--soft); border-color:var(--main-line); color:var(--main-ink); }
  .scale input { transform:scale(1.2); accent-color:#8fc9b6; margin:0; }
  .scale-ends { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--sub); margin-top:4px; }
  .avg { font-size:22px; font-weight:700; color:var(--main-ink); }
  /* 設問の補足説明・非表示・下書き・取り込み */
  .qnote { font-size:13px; color:var(--sub); white-space:pre-wrap; margin:4px 0 8px; padding:8px 12px; background:#fff; border-left:3px solid #cfe3f5; border-radius:0 10px 10px 0; }
  /* 回答画面: 作成画面と同じく、設問文(主)は空色の太枠、補足説明(副)は一段下げる */
  .qhead { background:#e3f0fb; border:2px solid #a8cff0; color:#2f5878; font-weight:600; border-radius:12px; padding:10px 13px; margin-bottom:8px; }
  .qhead .req { background:#fff; border-radius:99px; padding:1px 8px; }
  .qnote.sub-of { margin:0 0 10px 14px; color:#6b6880; font-size:14px; border:1px solid #edf2f7; border-left:3px solid #cfe3f5; }
  /* 作成画面: 設問文(主)は空色の太枠、補足説明(副)は白地に左の線で一段下げる */
  textarea.qtext { background:#e3f0fb; border:2px solid #a8cff0; color:#2f5878; font-weight:600; min-height:0; resize:none; overflow:hidden; }
  textarea.qtext:focus { border-color:#7fb6e6; box-shadow:0 0 0 3px #e3f0fb; }
  textarea.qnotein { margin-left:14px; width:calc(100% - 14px); background:#fff; border:1px solid #edf2f7; border-left:3px solid #cfe3f5; border-radius:0 10px 10px 0; color:#6b6880; font-size:14px; min-height:56px; overflow:hidden; }
  textarea.qnotein:focus { border-color:#cfe3f5; border-left-color:#a8cff0; box-shadow:0 0 0 3px #f0f6fc; }
  .qbox.off { opacity:.6; background:#f6f5f8; }
  .draft { font-size:12px; color:var(--sub); text-align:right; min-height:1.4em; margin-top:6px; }
  .imp ol { margin:6px 0; padding-left:1.8em; font-size:14px; }
  .imp li { margin:4px 0; }
  /* シフト希望 */
  .scard { padding:12px; }
  .sday { display:grid; grid-template-columns:3em 1fr; gap:2px 6px; align-items:center; padding:6px 2px; border-bottom:1px solid var(--line); }
  .sday .dl .wd { display:block; font-size:12px; }
  .sday.chosen { background:#f3f8fd; }
  /* 休園日(日祝・年末年始など)の行は、Excelのシフト表の日祝の列と同じく淡いピンク */
  .sday.closed { background:#fdeaed; color:#b4606d; }
  .sday.closed .sub { color:#b4606d; font-weight:600; }
  .sday .dl { font-weight:600; font-size:14px; line-height:1.3; }
  .sday .ev { font-size:11px; font-weight:400; color:var(--sub); }
  .wd.sat { color:#3d6482; }
  .wd.sun { color:var(--pink-ink); }
  /* 選択肢は1日1行に収まるよう、行の幅を等分する(--n: 選択肢の数) */
  .sopts { display:grid; grid-template-columns:repeat(var(--n), minmax(0, 1fr)); gap:3px; }
  button.sopt { font-size:12px; line-height:1.2; padding:7px 1px; border-radius:10px; background:#fff; color:var(--ink); border:1.5px solid var(--line); font-weight:600; white-space:normal; word-break:keep-all; overflow-wrap:anywhere; }
  button.sopt:hover { filter:none; background:#f6f9fd; }
  button.sopt.on { background:#e3f0fb; border-color:#7fb6e6; color:#2f5878; }
  .sdedit { display:grid; grid-template-columns:5.2em auto 1fr; gap:6px 8px; align-items:center; padding:4px 2px; border-bottom:1px solid var(--line); font-size:14px; }
  .sdedit.closed { background:#fdeaed; }
  .sdedit input[type=text] { padding:6px 9px; font-size:14px; }
  .scnt { display:inline-flex; flex-wrap:wrap; gap:4px; vertical-align:middle; }
  .scnt-c { font-size:12px; font-weight:600; padding:1px 8px; border-radius:99px; border:1px solid; white-space:nowrap; }
  .soptedit { display:grid; grid-template-columns:1fr 5.5em 6.5em auto; gap:6px; align-items:center; margin:6px 0; }
  .soptedit select { padding:7px 6px; font-size:14px; }
  .soptedit input { padding:7px 10px; font-size:14px; }
  .stbl { overflow-x:auto; margin-top:8px; }
  table.shift { width:auto; border-collapse:collapse; font-size:12px; white-space:nowrap; }
  table.shift th, table.shift td { text-align:center; padding:3px 5px; border:1px solid var(--line); min-width:2.2em; }
  table.shift .nm { text-align:left; position:sticky; left:0; background:#fff; z-index:1; }
  table.shift .cl { background:#fdeaed; color:#b4606d; }
  table.shift .ev { font-size:10px; color:var(--sub); white-space:normal; max-width:4em; line-height:1.2; }
  table.shift tr.pend .nm { color:var(--pink-ink); }
  table.shift tr.blankrow td { background:repeating-linear-gradient(45deg,#fafafc,#fafafc 4px,#f1f0f5 4px,#f1f0f5 8px); }
  table.shift tr.blankrow td.cl { background:#fdeaed; }
  .sortrow.blank { background:#fafafc; }
  table.shift .cnt { min-width:2.6em; font-weight:600; }
  table.shift tr:not(:first-child) th.cnt { border-top-color:transparent; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ver"></div>
<script>
// ====== GASの窓口(データの読み書きだけを担当) ======
// GASのデプロイを「新バージョン」で更新する限り、このURLは変わりません。
// ====== 版番号 ======
// 画面(この index.html)を修正したら、ここの番号を上げて、下の更新履歴に1行足す。
// 番号は「年.月.日-その日の何回目か」。GAS側の版番号(コード.gs の GAS_VERSION)とは別に数える。
const APP_VERSION = '2026.11.04-8';
// 更新履歴(画面)
//  2026.10.26-1  版番号の表示を追加。回収メモ(提出物の回収管理)を追加。回収済みの人を下へ並べる、
//                チェックした瞬間に色を変える、提出物の欄は未提出のものだけ表示、担当している回収メモのカード。
//                アンケートの管理者・回収メモの担当者から、作成者を外せるようにした(代理作成)。
//  2026.10.26-2  ログイン後の画面は終わっていないものだけ表示(担当しているものも未回答・未回収があるものだけ)。
//                担当の管理ボタンを「+ 新規作成」の横に戻した。
//  2026.10.26-3  ログイン後の画面から「担当しているもの」のカードをなくした(自分の未回答・未提出だけを表示)。
//                担当の仕事は「自分が担当している管理」ボタンから開く。
//  2026.10.30-1  アンケート・回収メモの一覧を「現行」と「アーカイブ」(締め切り・期限切れ)に分けた。
//  2026.11.04-1  シフト希望を追加(月を選ぶと日付・曜日・祝日を自動で並べる。1日1つ選んで提出、締め切りまで出し直し可。
//                集計はExcelのシフト表に貼り付けられる形でコピー。行の並び順はシフト希望ごとにドラッグで変えられる)。
//                選択肢ごとに色を付け、集計の表に1人ずつの日数(有給○日など)と全員の合計を出す。
//                休園日の行はピンクにする。
//  2026.11.04-2  年末年始の休園日を期間で指定(初期値 12/29〜12/31・1/1〜1/3)。
//                12月・1月を新しく作るときは最初から休園日にする。
//  2026.11.04-3  年末年始の期間を覚えるのをやめた(暦で毎年前後するので、毎回 12/29〜12/31・1/1〜1/3 から始める)。
//  2026.11.04-4  シフト希望の作成画面で、行事の入力欄の例(「行事など(例: 秋の遠足)」)を消した。
//  2026.11.04-5  ログイン後のシフト希望のボタンを「シフト希望を作成する」に(入力画面の「提出する」で送る)。
//  2026.11.04-6  Excel用のコピーに「その他希望・連絡」の列を入れられるようにした(1日の左。シフト表のD列「希望」に合わせる)。
//  2026.11.04-7  行の並べ替えで空行(産休中の先生の行・区切りの行など)を追加できるようにした。コピーでは記号のない行になる(GAS 2026.11.04-3 が必要)。
//  2026.11.04-8  シフト希望の対象の職員を作成・修正の画面で選べるようにした。行の並べ替えで「欄外へ」(この月は対象外)にもできる
//                (対象外の人には提出のお願いを出さず、未提出の数・コピーにも入れない。GAS 2026.11.04-4 が必要)。

const GAS_URL = 'https://script.google.com/macros/s/AKfycbzArLDP5bk6o9l0yoN1SCvu0aT69dIKvM-hYlCTYMHhZDgvWSfpCr2Ez9cNekm0DHNP/exec';

// 起動情報はこのページのURLから読み取る(?s=アンケートID / ?admin=1)
const BOOT = (() => {
  const p = new URLSearchParams(location.search);
  return {
    mode: p.has('admin') ? 'admin' : 'staff',
    surveyId: String(p.get('s') || '').replace(/[^A-Za-z0-9]/g, ''),
    baseUrl: location.origin + location.pathname,
  };
})();
const app = document.getElementById('app');
const S = {};   // 画面状態(メモリ上のみ。ログイン情報は端末に保存しない。入力途中の下書きだけ保存する)

// ---------- 小道具 ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  Object.keys(attrs || {}).forEach(k => {
    const v = attrs[k];
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'disabled') el.disabled = !!v;
    else el.setAttribute(k, v);
  });
  kids.flat(Infinity).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return el;
}
// GASの関数を呼び出す。Googleのログイン情報(Cookie)は送らないので、
// ブラウザに複数アカウントでログインしていても影響を受けない。
// text/plain で送るのは、GASが受け付けられない事前確認(CORSプリフライト)を避けるため。
async function call(fn, ...args) {
  let res;
  try {
    res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args }),
      credentials: 'omit',
      redirect: 'follow',
    });
  } catch (e) {
    throw new Error('通信エラーです。電波の良いところで、もう一度お試しください。');
  }
  let r;
  try { r = await res.json(); } catch (e) { throw new Error('通信エラーです。時間をおいて、もう一度お試しください。'); }
  if (r && r.ok) return r.data;
  throw new Error(r && r.error ? r.error : '通信エラー');
}
function show(...nodes) {
  app.replaceChildren(...nodes.flat(Infinity).filter(n => n !== null && n !== undefined && n !== false));
  try { window.scrollTo(0, 0); } catch (e) {}
}
// 入力欄の高さを中身に合わせる(画面に出ていない間は何もしない)
function autoGrow(el) {
  if (!el.isConnected) return;
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 4) + 'px';
}
function errBox(msg) { return h('div', { class: 'err' }, msg); }

function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

// ---------- 入力途中の下書き(端末に自動保存) ----------
// 回答: 'draft:a:職員ID:アンケートID' / 作成: 'draft:c:作成者:範囲'。送信・作成が済んだら消す。
const DRAFT_DAYS = 30;
function draftLoad(k) {
  try { const d = JSON.parse(lsGet(k) || 'null'); return d && d.v ? d : null; } catch (e) { return null; }
}
function draftSave(k, v) { lsSet(k, JSON.stringify({ t: Date.now(), v: v })); }
// 古い下書き(30日以上前)を掃除する
function draftPurge() {
  try {
    const old = Date.now() - DRAFT_DAYS * 86400000, del = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.slice(0, 6) === 'draft:') { const d = draftLoad(k); if (!d || d.t < old) del.push(k); }
    }
    del.forEach(lsDel);
  } catch (e) {}
}
// 入力のたびに少し待ってから保存し、保存した時刻を表示する
function draftSaver(key, collect, label) {
  let timer = null;
  const run = () => {
    timer = null;
    draftSave(key, collect());
    const d = new Date();
    label.textContent = '下書きをこの端末に保存しました(' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') + ')';
  };
  const fn = () => { clearTimeout(timer); timer = setTimeout(run, 600); };
  fn.cancel = () => { clearTimeout(timer); timer = null; };
  fn.flush = () => { if (timer) { clearTimeout(timer); run(); } };   // 保存待ちがあれば今すぐ保存
  return fn;
}
function fmtTime(t) { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }

// ---------- 文章から設問を取り込む ----------
// Word等から貼り付けた文章(Markdown風)を設問に変換する。
//  「## Q1. ○○」→ 設問文(「Q1.」は外す)/ 見出しから「回答：」までの文章 → その設問の補足説明
//  最初の設問より前の文章 → アンケートの説明 /「# タイトル」→ タイトル
const MD_RULE = /^\s*[-－ー―─━_＿*＊=＝]{3,}\s*$/;   // 区切り線(---、***、―――など)
function mdInline(s) { return String(s).replace(/^\s*#{1,6}\s*/, '').replace(/\*\*|__|`/g, '').trim(); }
function mdBlock(lines) {
  return lines.map(l => MD_RULE.test(l) ? '' : mdInline(l.replace(/^\s*>\s?/, '').replace(/^(\s*)[-*+]\s+/, '$1・')))
    .join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
function parseSurveyText(src) {
  const lines = String(src || '').replace(/\r\n?/g, '\n').replace(/ /g, ' ').split('\n');
  // Q番号の見出し。「#」が付いているか、番号の後に「.」「:」「)」などがあるものだけ(本文中の「Q1で…」は拾わない)
  const QH = /^\s*(#{1,6})?\s*(?:\*\*\s*)?(?:[QＱ]|問)\s*[0-9０-９]+\s*([.．。、,，:：)）]?)\s*(.*)$/i;
  const qHead = l => { const m = l.match(QH); return m && (m[1] || m[2]) ? m[3] : null; };
  const useQ = lines.some(l => qHead(l) !== null);
  const ANS = /^\s*(?:\*\*\s*)?【?\s*回答\s*(?:[:：]|】)/;
  let title = '', cur = null;
  const pre = [], qs = [];
  lines.forEach(l => {
    // Q番号の見出しがない文章では「##」以下の見出しを設問にする
    const t = useQ ? qHead(l) : ((l.match(/^\s*#{2,6}\s+(.+)$/) || [])[1] || null);
    if (t !== null) { cur = { text: mdInline(t), body: [], closed: false }; qs.push(cur); return; }
    if (!cur) {
      const m = l.match(/^\s*#\s+(.+)$/);
      if (m && !title) title = mdInline(m[1]); else pre.push(l);
      return;
    }
    if (cur.closed) return;   // 「回答：」より後(回答欄)は使わない
    if (ANS.test(l)) { cur.closed = true; return; }
    cur.body.push(l);
  });
  return {
    title: title,
    description: mdBlock(pre),
    questions: qs.map(q => {
      // 「## Q1.」だけで設問文が次の行にある場合
      if (!q.text) { const i = q.body.findIndex(x => mdInline(x) && !MD_RULE.test(x)); if (i >= 0) { q.text = mdInline(q.body[i]); q.body.splice(0, i + 1); } }
      return { text: q.text, note: mdBlock(q.body) };
    }).filter(q => q.text),
  };
}
function fmtDate(d) { return d ? d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, (m, y, mo, da) => y + '年' + Number(mo) + '月' + Number(da) + '日') : 'なし'; }
function statusGroups(people) {
  // people: [{ name, done }] → 未回答(色つき) と 回答済み(グレー) を分けて表示
  const pend = people.filter(p => !p.done), done = people.filter(p => p.done);
  return h('div', {},
    h('div', { class: 'grp' }, '未回答(' + pend.length + '人)'),
    pend.length ? h('div', { class: 'chips' }, pend.map(p => h('span', { class: 'chip' }, p.name))) : h('div', { class: 'sub' }, '全員回答済みです'),
    h('div', { class: 'grp' }, '回答済み(' + done.length + '人)'),
    done.length ? h('div', { class: 'chips' }, done.map(p => h('span', { class: 'chip done' }, p.name))) : h('div', { class: 'sub' }, 'まだいません'));
}
// 職員の一覧画面に出す回答状況。
// ふだんはバーと人数だけ。「名前を見る」で開くと、未回答(あなたが先頭)と回答済み(回答した順)を出す。
// 遅れがちな人が「周りはもう済ませている」と気付けるようにするのが目的。
// o: シフト希望などで言葉を変えるとき { key, pend: '未提出', done: '提出済み', order: '提出した順', meLeft: 自分がまだか }
function staffProgress(v, o) {
  o = o || {};
  const PEND = o.pend || '未回答', DONE = o.done || '回答済み', key = o.key || v.surveyId;
  // アンケートの一覧に出るのは自分がまだ答えていないものだけなので、ふつうは未回答に自分が入っている
  const meLeft = o.meLeft !== false;
  const pr = v.progress;
  if (!pr || !pr.total) return null;
  // 無記名は人数だけ(名前は送られてこない)
  const people = pr.people || [];
  const done = people.filter(p => p.done);   // GAS側で回答した順に並んでいる
  const pend = people.filter(p => !p.done).sort((a, b) => (b.me ? 1 : 0) - (a.me ? 1 : 0));
  const pendN = pr.total - pr.done;
  const names = h('div', { class: 'pnames' },
    h('div', { class: 'pgrp pend' }, PEND + ' ' + pendN + '人'),
    h('div', { class: 'plist' }, pend.length ? pend.map((p, i) => [i ? '、' : '',
      p.me ? h('b', { class: 'pme' }, p.name + '(あなた)') : p.name]) : 'なし'),
    h('div', { class: 'pgrp' }, DONE + ' ' + pr.done + '人(' + (o.order || '回答した順') + ')'),
    h('div', { class: 'plist done' }, done.length ? done.map(p => p.name).join('、') : 'まだいません'));
  S.st.openProg = S.st.openProg || {};   // 開いた状態はアンケートごとに覚えておく(ログアウトまで)
  const tog = h('button', { class: 'ptoggle', type: 'button' });
  function apply() {
    const open = !!S.st.openProg[key];
    names.style.display = open ? '' : 'none';
    tog.textContent = open ? '▾ 名前を閉じる' : '▸ 名前を見る';
  }
  tog.addEventListener('click', () => { S.st.openProg[key] = !S.st.openProg[key]; apply(); });
  apply();
  return h('div', { style: 'margin-top:10px' },
    h('div', { class: 'prog' }, h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.round(pr.done * 100 / pr.total) + '%' })),
      h('span', {}, (v.allOrg ? 'この園 ' : '') + pr.done + '/' + pr.total + '人' + (v.allOrg && pr.allTotal ? ' ・ 全園 ' + pr.allDone + '/' + pr.allTotal + '人' : ''))),
    h('div', { class: 'pills' },
      h('span', { class: 'pill pend' }, PEND + ' ' + pendN + '人' + (meLeft ? '(あなたを含む)' : '')),
      h('span', { class: 'pill' }, DONE + ' ' + pr.done + '人')),
    people.length ? [tog, names] : null);
}

// 全園共通アンケートの園別回答状況(人数のバー)
function facilityProgress(list) {

// 非表示の設問は回答画面・結果・CSVに出さない(データは残っている)
function visibleQs(sv) { return (sv.questions || []).filter(q => !q.hidden); }
function audienceTag(v) { return v.audience === 'director' ? h('span', { class: 'tag warn' }, '園長のみ') : null; }
// 設問単位の「園長だけに聞く」
function dirTag(q) { return q.directorOnly ? h('span', { class: 'tag lav', style: 'margin-left:6px;font-weight:600' }, '園長のみ') : null; }
function csvCell(v) {
  let t = Array.isArray(v) ? v.join('、') : (v === null || v === undefined ? '' : String(v));
  if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;   // Excelで数式として実行されるのを防ぐ
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function resultsCsv(r) {
  const qs = visibleQs(r.survey), anon = r.survey.anonymous, all = !!r.survey.all;
  const fcol = all ? ['園'] : [];
  const rows = [[anon ? '回答番号' : '名前'].concat(fcol, anon ? [] : ['回答状況'], qs.map((q, i) => 'Q' + (i + 1) + ' ' + q.text + (q.directorOnly ? '(園長のみ)' : '')))];
  if (anon) {
    (r.anonRows || []).forEach((a, i) => rows.push([String(i + 1)].concat(all ? [a._f || '(非表示)'] : [], qs.map(q => a[q.id]))));
  } else {
    (r.people || []).forEach(p => rows.push([p.name].concat(all ? [p.facility] : [], ['回答済み'], qs.map(q => p.answers[q.id]))));
    if (all && r.groups) r.groups.forEach(g => g.notCompleted.forEach(n => rows.push([n, g.name, '未回答'].concat(qs.map(() => '')))));
    else r.notCompleted.forEach(n => rows.push([n, '未回答'].concat(qs.map(() => ''))));
  }
  return rows.map(row => row.map(csvCell).join(',')).join('\r\n');
}
function downloadCsv(name, text) {
  const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });   // BOM付き(Excelで文字化けしない)
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function copyBox(text, label) {
  const ta = h('textarea', { style: 'min-height:150px;' });
  ta.value = text;
  const msg = h('span', { class: 'sub' });
  const btn = h('button', { class: 'small', onclick: async () => {
    try { await navigator.clipboard.writeText(ta.value); msg.textContent = 'コピーしました'; }
    catch (e) { ta.select(); try { document.execCommand('copy'); msg.textContent = 'コピーしました'; } catch (e2) { msg.textContent = '選択したので、長押し/右クリックでコピーしてください'; } }
  } }, label || 'コピー');
  return h('div', {}, ta, h('div', { class: 'row', style: 'margin-top:6px' }, btn, msg));
}

function staffLogin() {
  S.st = null;
  const facSel = h('select', {}, h('option', { value: '' }, '読み込み中…'));
  const nameSel = h('select', { disabled: true }, h('option', { value: '' }, '先に園を選んでください'));
  const pin = h('input', { type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '4', autocomplete: 'off', placeholder: '4桁の数字' });
  const box = h('div');
  const btn = h('button', { class: 'block' }, 'ログイン');

  function loadStaff() {
    const fid = facSel.value;
    nameSel.replaceChildren(h('option', { value: '' }, '読み込み中…'));
    nameSel.disabled = true;
    if (!fid) { nameSel.replaceChildren(h('option', { value: '' }, '先に園を選んでください')); return; }
    lsSet('lastFacility', fid);
    call('getStaffNames', fid).then(list => {
      nameSel.replaceChildren(h('option', { value: '' }, '名前を選んでください'),
        ...list.map(s => h('option', { value: s.staffId }, s.name)));
      nameSel.disabled = false;
    }).catch(e => setMsg(box, errBox(e.message)));
  }
  facSel.addEventListener('change', loadStaff);

  call('getFacilities').then(list => {
    const last = lsGet('lastFacility');
    facSel.replaceChildren(h('option', { value: '' }, '園を選んでください'),
      ...list.map(f => h('option', { value: f.facilityId }, f.name)));
    if (last && list.some(f => f.facilityId === last)) { facSel.value = last; loadStaff(); }
  }).catch(e => setMsg(box, errBox(e.message)));

  btn.addEventListener('click', () => {
    setMsg(box, null);
    if (!facSel.value || !nameSel.value) return setMsg(box, errBox('園と名前を選んでください。'));
    if (!/^\d{4}$/.test(pin.value)) return setMsg(box, errBox('PINは4桁の数字で入力してください。'));
    const staffId = nameSel.value, p = pin.value;
    withBusy(btn, call('staffLogin', staffId, p).then(r => {
      S.st = { staffId: staffId, pin: p, name: r.name };
      if (r.mustChangePin) return staffChangePin();
      staffApply(r);
      staffAfterLogin();
    }).catch(e => setMsg(box, errBox(e.message))));
  });

  show(h('h1', {}, '職員アンケート'),
    h('div', { class: 'sub' }, '園と名前を選び、PINを入力してください。'),
    h('div', { class: 'card' },
      h('label', { class: 'f' }, '園'), facSel,
      h('label', { class: 'f' }, '名前'), nameSel,
      h('label', { class: 'f' }, 'PIN(4桁)'), pin,
      box, btn),
    h('div', { class: 'note' }, 'この端末にPINは残りません。ただし、回答途中の内容は送信するまでこの端末に保存されます。園の業務用スマホ・パソコンではなく、ご自身のスマホなどで回答してください。PINを忘れたときは園長に伝えてください。'),
    h('div', { class: 'center', style: 'margin-top:28px' }, h('button', { class: 'ghost small', onclick: adminLogin }, '園長・統括の方はこちら')));
}

function staffChangePin() {
  const np = h('input', { type: 'password', inputmode: 'numeric', maxlength: '4', autocomplete: 'off', placeholder: '新しい4桁' });
  const np2 = h('input', { type: 'password', inputmode: 'numeric', maxlength: '4', autocomplete: 'off', placeholder: 'もう一度' });

    setMsg(box, null);

    }
    return h('div', { class: 'card' },
      h('div', { class: 'qhead' }, (i + 1) + '. ' + q.text, q.required ? h('span', { class: 'req' }, '必須') : null, dirTag(q)),
      q.note ? h('div', { class: 'qnote sub-of' }, q.note) : null,
      q.type === 'multi' ? h('div', { class: 'sub' }, '複数選べます') : null,
      body);
  });
  function readAns() {
    const ans = {};
    qs.forEach(q => {
      if (q.type === 'text') ans[q.id] = inputs[q.id].value;
      else if (q.type === 'single' || q.type === 'scale') { const c = inputs[q.id].find(x => x.checked); ans[q.id] = c ? c.value : ''; }
      else ans[q.id] = inputs[q.id].filter(x => x.checked).map(x => x.value);
    });
    return ans;
  }
  function fillAns(ans) {
    qs.forEach(q => {
      const v = ans[q.id];
      if (v === undefined) return;
      if (q.type === 'text') inputs[q.id].value = String(v);
      else inputs[q.id].forEach(x => { x.checked = Array.isArray(v) ? v.indexOf(x.value) >= 0 : x.value === v; });
    });
  }

  // ---- 下書き(この端末に自動保存。本人がPINでログインしたときだけ復元される) ----
  const dKey = 'draft:a:' + S.st.staffId + ':' + sv.surveyId;
  const dLabel = h('div', { class: 'draft' });
  const save = draftSaver(dKey, readAns, dLabel);
  S.flush = save.flush;
  const draft = draftLoad(dKey);
  let dNote = null;
  if (draft) {
    fillAns(draft.v);
    dNote = h('div', { class: 'ok' }, '前回の入力途中の内容(' + fmtTime(draft.t) + ' 保存)を復元しました。',
      h('div', { style: 'margin-top:6px' }, h('button', { class: 'ghost small', onclick: () => {
        if (!confirm('入力した内容をすべて消して、最初からやり直します。よろしいですか?')) return;
        save.cancel(); lsDel(dKey); staffSurvey(sv);
      } }, '下書きを消して最初から')));
  }

  const btn = h('button', { class: 'block' }, '送信する');
  btn.addEventListener('click', () => {
    setMsg(box, null);
    const ans = readAns();
    for (const q of qs) {
      const v = ans[q.id];
      if (q.required && (Array.isArray(v) ? !v.length : !String(v).trim())) return setMsg(box, errBox('「' + q.text + '」は必須です。'));
    }
    save.cancel(); draftSave(dKey, ans);   // 送信に失敗しても入力が残るように
    withBusy(btn, call('submitAnswers', S.st.staffId, S.st.pin, sv.surveyId, ans).then(() => {
      lsDel(dKey);
      S.st.surveys = S.st.surveys.filter(x => x.surveyId !== sv.surveyId);
      S.st.answered.push(sv.surveyId);
      staffDone(sv);
    }).catch(e => setMsg(box, errBox(e.message))));
  });
  show(h('div', { class: 'row between' }, h('span', {}, audienceTag(sv), h('span', { class: 'tag' + (sv.anonymous ? '' : ' gray') }, sv.anonymous ? '無記名' : '記名')),
      h('button', { class: 'ghost small', onclick: () => { save.flush(); staffList(); } }, '一覧に戻る')),
    h('h1', {}, sv.title),
    sv.description ? h('div', { class: 'sub', style: 'white-space:pre-wrap' }, sv.description) : null,
    h('div', { class: 'note' }, sv.anonymous
      ? 'このアンケートは無記名です。回答内容とお名前は紐づけて保存されません(回答済みかどうかだけが記録されます)。'
      : 'このアンケートは記名式です。回答はお名前と一緒に保存されます。',
      h('div', { style: 'margin-top:4px' }, '入力途中の内容は、この端末に下書きとして自動保存されます。画面を閉じても、次にログインしたときに続きから入力できます(送信すると消えます)。')),
    dNote,
    h('div', { oninput: save, onchange: save }, blocks), box, btn, dLabel);
}

  // ---- 並べ替え(ドラッグ、または▲▼で動かして、最後に保存) ----

    setMsg(listMsg, null);
    const order = staff.slice();
    const wrap = h('div');
    const save = h('button', { class: 'small' }, 'この順番で保存');
    function move(i, d) {
      const j = i + d;
      if (j < 0 || j >= order.length) return;
      const t = order[i]; order[i] = order[j]; order[j] = t;
      draw();
    }
    function draw() {
      wrap.replaceChildren(...order.map((s, i) => {
        const row = h('div', { class: 'sortrow' },
          h('span', { class: 'grip', 'aria-hidden': 'true' }, '⠿'),
          h('span', { class: 'sortno' }, String(i + 1)),
          h('span', { class: 'sortname', style: s.active ? '' : 'color:#999' }, s.name, s.active ? null : h('span', { class: 'tag gray', style: 'margin-left:6px' }, '無効')),
          h('button', { class: 'ghost small', disabled: i === 0, onclick: () => move(i, -1), 'aria-label': '上へ' }, '▲'),
          h('button', { class: 'ghost small', disabled: i === order.length - 1, onclick: () => move(i, 1), 'aria-label': '下へ' }, '▼'));
        row.dataset.id = s.staffId;
        row.addEventListener('pointerdown', e => sortDrag(e, row, wrap, () => {
          const ids = [...wrap.children].map(r => r.dataset.id);
          order.sort((a, b) => ids.indexOf(a.staffId) - ids.indexOf(b.staffId));

      }));

    save.addEventListener('click', () => {
      withBusy(save, call('adminReorderStaff', S.ad.cred, order.map(s => s.staffId)).then(() => {
        setMsg(listMsg, h('div', { class: 'ok' }, '並び順を保存しました。回答画面の名前の一覧も、この順番になります。'));

      }).catch(e => setMsg(listMsg, errBox(e.message))));

    draw();
    sortBtn.style.display = 'none';
    listBox.replaceChildren(h('div', { class: 'sub', style: 'margin-bottom:8px' }, '名前をドラッグして順番を入れ替え、「この順番で保存」を押してください(スマホは左の ⠿ をつかんで動かします。▲▼でも動かせます)。'),
      wrap, h('div', { class: 'row', style: 'margin-top:10px' }, save, h('button', { class: 'ghost small', onclick: () => { setMsg(listMsg, null); renderList(); } }, 'やめる')));

      load();
    }).catch(e => setMsg(box, errBox(e.message))));
  });
  body.append(h('div', { class: 'card' }, h('h2', {}, '職員を追加'), names, addBtn, box, resBox),
    h('div', { class: 'card' }, h('div', { class: 'row between' }, h('h2', { style: 'margin:0' }, '職員一覧'), sortBtn), listMsg, listBox,
      h('div', { class: 'sub', style: 'margin-top:8px' }, 'ここでの並び順が、職員のログイン画面の名前の一覧や、回答状況の表示順になります。新しく追加した職員は一番下に入ります。'),

      h('div', { class: 'sub', style: 'margin-top:4px' }, '「園長にする」を押した職員には、全園共通の「園長のみ」アンケートが表示されます(園長も職員として名前を登録してください)。'),
      h('div', { class: 'sub', style: 'margin-top:4px' }, '退職・異動した方は「無効にする」を選ぶと、名前が回答画面に出なくなります(過去の回答は残ります)。')));

// 並べ替えのドラッグ(職員一覧・シフト希望の行の順で共通)。done: 指を離したあとに呼ぶ
// マウスは行のどこからでも、スマホは左の「⠿」をつかんで動かす(行の他の場所は画面のスクロールに使う)
function sortDrag(e, row, wrap, done) {
  if (e.button > 0 || e.target.closest('button, input')) return;   // ボタンや入力欄を押したときは動かさない
  if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
  e.preventDefault();
  row.setPointerCapture(e.pointerId);
  row.classList.add('dragging');
  const onMove = ev => {
    // 指(カーソル)より上にある行の数 = 入るべき位置。
    // つかんでいる行を抜き差しするとドラッグが切れるので、隣の行のほうを入れ替えて近づける
    const y = ev.clientY;
    const rows = [...wrap.children];
    const want = rows.filter(r => r !== row && r.getBoundingClientRect().top + r.offsetHeight / 2 < y).length;
    let idx = rows.indexOf(row);
    while (idx > want) { wrap.insertBefore(row.previousSibling, row.nextSibling); idx--; }
    while (idx < want) { wrap.insertBefore(row.nextSibling, row); idx++; }
    // 画面の端に近づいたら自動でスクロール
    if (y < 60) window.scrollBy(0, -12); else if (y > window.innerHeight - 60) window.scrollBy(0, 12);
  };
  const onEnd = () => {
    row.removeEventListener('pointermove', onMove);
    row.removeEventListener('pointerup', onEnd);
    row.removeEventListener('pointercancel', onEnd);
    row.classList.remove('dragging');
    done();
  };
  row.addEventListener('pointermove', onMove);
  row.addEventListener('pointerup', onEnd);
  row.addEventListener('pointercancel', onEnd);
}

        v.canEdit === false ? null : h('button', { class: 'ghost small', onclick: () => adminEdit(v) }, '内容を修正'),
        v.canEdit === false ? null : h('button', { class: 'ghost small', onclick: () => adminQuestionVisibility(v) }, '設問の表示・非表示'),
        v.canEdit === false ? null : h('button', { class: 'ghost small', onclick: () => {
          call('adminSetSurveyStatus', S.ad.cred, v.surveyId, v.status === 'open' ? 'closed' : 'open').then(adminMain).catch(e => setMsg(box, errBox(e.message)));
        } }, v.status === 'open' ? '受付を締め切る' : '受付を再開'),
        v.canEdit === false ? null : h('button', { class: 'danger small', onclick: () => {
          if (!confirm('「' + v.title + '」と、その回答をすべて削除します。元に戻せません。よろしいですか?')) return;
          call('adminDeleteSurvey', S.ad.cred, v.surveyId).then(adminMain).catch(e => setMsg(box, errBox(e.message)));
        } }, '削除'))));
  }).catch(e => setMsg(box, errBox(e.message)));
}

// 一覧を「現行」と「アーカイブ」に分けて表示する。
// isArch: アーカイブに入れるか / key: どの一覧か(選んだ側をログアウトまで覚えておく) / card: 1件分のカードを作る
function archiveTabs(listBox, list, isArch, key, card) {
  S.ad.arch = S.ad.arch || {};
  const cur = list.filter(x => !isArch(x)), arc = list.filter(isArch);
  const label = { surveys: 'アンケート', collections: '回収メモ', shifts: 'シフト希望' }[key];
  const btnCur = h('button', { class: 'small' }), btnArc = h('button', { class: 'small' });
  const body = h('div');
  function draw() {
    const a = !!S.ad.arch[key];
    btnCur.className = 'small ' + (a ? 'ghost' : 'on');
    btnArc.className = 'small ' + (a ? 'on' : 'ghost');
    btnCur.textContent = '現行(' + cur.length + ')';
    btnArc.textContent = 'アーカイブ(' + arc.length + ')';
    const items = a ? arc : cur;
    body.replaceChildren(...(items.length ? items.map(card) : [h('div', { class: 'card sub' }, a
      ? 'アーカイブはありません。締め切った' + label + 'や、期限が過ぎた' + label + 'がここに入ります。'
      : '受付中の' + label + 'はありません。' + (arc.length ? '終わったものは「アーカイブ」にあります。' : '上のボタンから作りましょう。'))]));
  }
  btnCur.addEventListener('click', () => { S.ad.arch[key] = false; draw(); });
  btnArc.addEventListener('click', () => { S.ad.arch[key] = true; draw(); });
  draw();
  listBox.replaceChildren(h('div', { class: 'row atabs' }, btnCur, btnArc,
    h('span', { class: 'sub' }, key === 'surveys' ? '締め切り・回答期限を過ぎたものはアーカイブへ移ります' : '締め切り・提出期限を過ぎたものはアーカイブへ移ります')), body);
}

// 依頼文・催促文に付ける注意書き(回答途中の下書きは送信するまで端末に残るため)
const DEVICE_NOTICE = '※回答途中の内容は、送信するまで使った端末に保存されます。園の業務用スマホ・パソコンではなく、ご自身のスマホなどで回答してください。';
function surveyUrl(id) { return BOOT.baseUrl + '?s=' + id; }

function adminShareText(v) {
  const text = '【アンケートのお願い】\n' + v.title + '\n'
    + (v.deadline ? '回答期限: ' + fmtDate(v.deadline) + '\n' : '')
    + (v.audience === 'director' ? '※各園の園長の方が対象です\n' : '')
    + (v.anonymous ? '※無記名(回答内容とお名前は紐づきません)\n' : '')
    + '\n▼回答はこちら\n' + surveyUrl(v.surveyId) + '\n\n'
    + '園と名前を選び、PIN(4桁)を入力してください。\n' + DEVICE_NOTICE;
  show(h('button', { class: 'ghost small', onclick: adminMain }, '← 戻る'), h('h1', {}, 'Chatwork用の依頼文'),
    h('div', { class: 'card' }, copyBox(text, 'コピー'), h('div', { class: 'sub', style: 'margin-top:8px' }, 'Chatworkのグループチャットに貼り付けて送信してください。')));
}

// 公開後の修正: 中身と「回答がある設問」を読み込んでから、作成画面を修正モードで開く
function adminEdit(v) {
  const back = h('button', { class: 'ghost small', onclick: adminMain }, '← 戻る');
  show(back, h('div', { class: 'sub' }, '読み込み中…'));
  call('adminGetSurveyForEdit', S.ad.cred, v.surveyId).then(adminCreate).catch(e => show(back, errBox(e.message)));
}

// edit: 修正するときは adminGetSurveyForEdit の結果。新規作成のときは undefined
function adminCreate(edit) {
  if (edit && !edit.surveyId) edit = undefined;   // ボタンのクリックイベントなどが渡ってきた場合
  // 回答がある設問(種類の変更・削除・選択肢を消すことはできない)
  const answered = new Set(edit ? edit.answered : []);
  const prevById = {};
  (edit ? edit.questions : []).forEach(q => { prevById[q.id] = q; });
  const title = h('input', { type: 'text', maxlength: '100', placeholder: '例: 9月の行事アンケート' });
  const desc = h('textarea', { placeholder: '説明(任意)', style: 'min-height:70px' });
  const deadline = h('input', { type: 'date' });
  const anon = h('input', { type: 'radio', name: 'anon', value: '1' });
  const named = h('input', { type: 'radio', name: 'anon', value: '0', checked: true });
  // 回答者(全園共通のみ): 全職員 / 園長のみ
  const audAll = h('input', { type: 'radio', name: 'aud', value: '', checked: true });
  const audDir = h('input', { type: 'radio', name: 'aud', value: 'director' });
  const qList = [];
  const qBox = h('div');
  const qMsg = h('div');
  const box = h('div');
  const addBtn = h('button', { class: 'ghost', onclick: () => { addQ(); saveDraft(); } }, '+ 設問を追加');

  // ---- 対象者・管理者の選択 ----
  let picks = [];      // 対象者 [{ s, cb }]
  let mgrPicks = [];   // 管理者 [{ s, cb }]
  const mgrList = h('div', {}, h('div', { class: 'sub' }, '読み込み中…'));
  const mgrCounter = h('span', { class: 'sub' });
  function updateMgrCount() {
    const n = mgrPicks.filter(p => p.cb.checked).length;
    mgrCounter.textContent = n ? n + '人を選択中' : '選択なし(園長だけが管理します)';
    setMsg(mgrWarn, mgrMeOff() ? h('div', { class: 'note' }, 'あなた(作成者)を外しています。作成後、あなたはこのアンケートの進捗・結果を見られなくなります(代理で作成するとき向け)。') : null);
  }
  const mgrWarn = h('div');
  const mgrMe = S.ad.admin ? '' : S.ad.cred.staffId;
  function mgrMeOff() { return !!mgrMe && mgrPicks.some(p => p.s.staffId === mgrMe && !p.cb.checked); }
  const counter = h('span', { class: 'sub' });
  const tgtList = h('div', {}, h('div', { class: 'sub' }, '読み込み中…'));
  function updateCount() { counter.textContent = picks.filter(p => p.cb.checked).length + ' / ' + picks.length + '人を選択中'; }
  function setAll(v) { picks.forEach(p => { p.cb.checked = v; }); updateCount(); }
  // ---- 範囲(一覧のボタンで決まる。統括は常に全園共通、職員は園内のみ) ----
  const isAll = () => edit ? !!edit.all : (!!S.ad.hq || (S.ad.admin && S.ad.createScope === 'ALL'));
  // 修正では記名・無記名、回答者、対象者、管理者は変えられない
  if (edit) {
    title.value = edit.title || ''; desc.value = edit.description || ''; deadline.value = edit.deadline || '';
    anon.checked = !!edit.anonymous; named.checked = !edit.anonymous;
    audDir.checked = edit.audience === 'director'; audAll.checked = !audDir.checked;
    [anon, named, audAll, audDir].forEach(x => { x.disabled = true; });
  }
  if (!edit && !isAll()) call('adminGetStaff', S.ad.cred).then(list => {
    // 管理者: 職員が作るときは本人に最初からチェック。代理で作成する場合は外せる
    const me = mgrMe;
    mgrPicks = list.filter(s => s.active).map(s => ({ s: s, cb: h('input', { type: 'checkbox', checked: s.staffId === me, onchange: updateMgrCount }) }));
    mgrList.replaceChildren(...mgrPicks.map(p => h('label', { class: 'opt' }, p.cb, h('span', {}, p.s.name, p.s.staffId === me ? h('span', { class: 'sub' }, '(あなた・作成者)') : null))));
    updateMgrCount();
    picks = list.filter(s => s.active).map(s => ({ s: s, cb: h('input', { type: 'checkbox', checked: true, onchange: updateCount }) }));
    if (!picks.length) return tgtList.replaceChildren(h('div', { class: 'err' }, '職員が登録されていません。先に「職員」タブで登録してください。'));
    tgtList.replaceChildren(...picks.map(p => h('label', { class: 'opt' }, p.cb, h('span', {}, p.s.name))));
    updateCount();
  }).catch(e => tgtList.replaceChildren(errBox(e.message)));
  const saveBtn = h('button', { class: 'block' }, edit ? '修正を保存する' : '作成する');

  // init: 取り込み・下書き・修正元からの初期値 { id, text, note, type, options, required, low, high, hidden, directorOnly }
  function addQ(init) {
    init = init || {};
    const locked = !!(init.id && answered.has(init.id));   // 回答がある設問
    // 設問文は長くても全文が見えるように、折り返して高さを自動で伸ばす(改行は入れない)
    const text = h('textarea', { rows: '1', class: 'qtext', placeholder: '設問文', value: init.text || '',
      onkeydown: e => { if (e.key === 'Enter' && !e.isComposing) e.preventDefault(); },
      oninput: () => { if (/\n/.test(text.value)) text.value = text.value.replace(/\s*\n\s*/g, ' '); autoGrow(text); } });
    const note = h('textarea', { class: 'qnotein', placeholder: '補足説明(任意)。設問の下に表示されます(例・記入のヒントなど)', value: init.note || '',
      oninput: () => autoGrow(note) });
    const type = h('select', {}, h('option', { value: 'single' }, '選択式(1つ選ぶ)'), h('option', { value: 'multi' }, '選択式(複数選べる)'), h('option', { value: 'scale' }, '5段階評価(1〜5)'), h('option', { value: 'text' }, '自由記述'));
    if (init.type) type.value = init.type;
    const opts = h('textarea', { placeholder: '選択肢を1行に1つずつ\n例:\nはい\nいいえ', style: 'min-height:80px', value: (init.options || []).join('\n') });
    const req = h('input', { type: 'checkbox', checked: init.required === undefined ? true : init.required });
    const hid = h('input', { type: 'checkbox', checked: !!init.hidden });
    const dir = h('input', { type: 'checkbox', checked: !!init.directorOnly });
    const optWrap = h('div', {}, opts);
    const low = h('input', { type: 'text', maxlength: '20', placeholder: '例: そう思わない', value: init.low || '' });
    const high = h('input', { type: 'text', maxlength: '20', placeholder: '例: そう思う', value: init.high || '' });
    const scaleWrap = h('div', { style: 'display:none' },
      h('div', { class: 'sub' }, '1と5の意味(任意)'),
      h('div', { class: 'row', style: 'flex-wrap:nowrap' }, h('span', { class: 'sub' }, '1:'), low, h('span', { class: 'sub' }, '5:'), high));
    const q = { id: init.id || '', text, note, type, opts, req, hid, dir, low, high };
    if (locked) {
      type.disabled = true;
      optWrap.append(h('div', { class: 'sub' }, 'すでに回答があるため、今ある選択肢は消せません(追加はできます)。'));
    }
    const wrap = h('div', { class: 'qbox' },
      h('div', { class: 'row between' }, h('b', { class: 'qn' }), locked
        ? h('span', { class: 'sub' }, h('span', { class: 'tag gray' }, '回答あり'), '削除できません(非表示にできます)')
        : h('button', { class: 'danger small', onclick: () => { qList.splice(qList.indexOf(q), 1); wrap.remove(); renum(); saveDraft(); } }, '削除')),
      text, h('div', { style: 'margin-top:6px' }, note), h('div', { style: 'margin-top:8px' }, type), h('div', { style: 'margin-top:8px' }, optWrap, scaleWrap),
      h('div', { class: 'row', style: 'margin-top:8px;font-size:14px;gap:16px' },
        h('label', {}, req, ' 必須にする'),
        h('label', {}, dir, ' 園長だけに聞く(他の職員には表示しない)'),
        h('label', {}, hid, ' 非表示にする(回答画面・結果に出さない)')));
    function applyType() {
      optWrap.style.display = (type.value === 'text' || type.value === 'scale') ? 'none' : '';
      scaleWrap.style.display = type.value === 'scale' ? '' : 'none';
    }
    function applyHidden() { wrap.classList.toggle('off', hid.checked); }
    type.addEventListener('change', applyType);
    hid.addEventListener('change', applyHidden);
    applyType(); applyHidden();
    q.wrap = wrap; qList.push(q); qBox.append(wrap); renum();
    // 画面に出てから高さを合わせる(取り込み・下書きの復元で最初から文字が入っている場合)
    requestAnimationFrame(() => { autoGrow(text); autoGrow(note); });
  }
  function renum() { qList.forEach((q, i) => { q.wrap.querySelector('.qn').textContent = '設問 ' + (i + 1); }); }
  function readQ(q) {
    return { id: q.id, text: q.text.value, note: q.note.value, type: q.type.value, options: q.opts.value.split('\n'), required: q.req.checked,
      low: q.low.value, high: q.high.value, hidden: q.hid.checked, directorOnly: q.dir.checked };
  }

  // ---- 文章から取り込む ----
  const impText = h('textarea', { style: 'min-height:200px;font-size:14px', placeholder: 'Wordなどの文章をそのまま貼り付けてください。\n\n例:\nこのアンケートは…(最初の設問より前は「説明」になります)\n\n## Q1. 今年度の振り返り\n例: うまくいったこと、課題など\n回答：\n\n## Q2. …' });
  const impOut = h('div');
  const impPanel = h('div', { class: 'card imp', style: 'display:none' },
    h('h2', {}, '文章から取り込む'),
    h('div', { class: 'sub' }, '「## Q1. ○○」のような見出しが設問文になります(「Q1.」は外します)。見出しから「回答：」までの文章は、その設問の補足説明として設問の下に表示されます。最初の設問より前の文章はアンケートの説明になります。'),
    h('div', { class: 'sub', style: 'margin-top:4px' }, '取り込んだ設問はすべて「自由記述・任意」になります。あとから1問ずつ種類や必須を変えられます。'),
    h('div', { style: 'margin-top:8px' }, impText),
    h('div', { class: 'row', style: 'margin-top:8px' },
      h('button', { class: 'small', onclick: previewImport }, '読み取る'),
      h('button', { class: 'ghost small', onclick: () => { impPanel.style.display = 'none'; } }, '閉じる')),
    impOut);
  const impBtn = h('button', { class: 'ghost', onclick: () => {
    impPanel.style.display = '';
    impPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    impText.focus();
  } }, '文章から取り込む');
  function previewImport() {
    const p = parseSurveyText(impText.value);
    if (!p.questions.length) return setMsg(impOut, errBox('設問が見つかりませんでした。「## Q1. ○○」のような見出しがあるか確認してください。'));
    const blank = qList.every(q => !q.text.value.trim());
    function apply(replace) {
      if (replace) { qList.forEach(q => q.wrap.remove()); qList.length = 0; }
      p.questions.forEach(x => addQ({ text: x.text, note: x.note, type: 'text', required: false }));
      if (p.title && !title.value.trim()) title.value = p.title;
      if (p.description && desc.value.trim() !== p.description) {
        if (!desc.value.trim() || confirm('説明(任意)の欄を、取り込んだ説明文に置き換えますか?\n(キャンセルすると今の説明のままにします)')) desc.value = p.description;
      }
      impText.value = ''; impPanel.style.display = 'none'; setMsg(impOut, null);
      setMsg(qMsg, h('div', { class: 'ok' }, p.questions.length + '問を取り込みました(すべて自由記述・任意)。必要に応じて、設問ごとに種類や必須を変更してください。'));
      saveDraft();
      qMsg.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    setMsg(impOut, h('div', { class: 'qbox' },
      p.title ? h('div', {}, h('b', {}, 'タイトル: '), p.title, title.value.trim() ? h('span', { class: 'sub' }, '(入力済みのタイトルを優先します)') : null) : null,
      h('div', {}, h('b', {}, '説明: '), p.description ? h('div', { class: 'qnote' }, p.description) : h('span', { class: 'sub' }, 'なし')),
      h('div', { style: 'margin-top:6px' }, h('b', {}, '設問 ' + p.questions.length + '問')),
      h('ol', {}, p.questions.map(x => h('li', {}, x.text, x.note ? h('div', { class: 'sub' }, '補足: ' + (x.note.length > 50 ? x.note.slice(0, 50) + '…' : x.note)) : null))),
      // 修正では、回答がある設問を消さないように「後ろに追加」だけにする
      h('div', { class: 'row', style: 'margin-top:8px' }, edit
        ? h('button', { class: 'small', onclick: () => apply(false) }, '今の設問の後ろに追加')
        : blank
        ? h('button', { class: 'small', onclick: () => apply(true) }, 'この内容で設問を作る')
        : [h('button', { class: 'small', onclick: () => apply(true) }, '今の設問と置き換える'),
           h('button', { class: 'ghost small', onclick: () => apply(false) }, '今の設問の後ろに追加')])));
  }

  // ---- 下書き(この端末に自動保存。作成・修正が済んだら消す) ----
  const who = S.ad.cred.staffId || S.ad.cred.fid;
  const dKey = edit ? 'draft:e:' + who + ':' + edit.surveyId : 'draft:c:' + who + ':' + (isAll() ? 'ALL' : 'ONE');
  const dLabel = h('div', { class: 'draft' });
  const saveDraft = draftSaver(dKey, () => ({ title: title.value, desc: desc.value, deadline: deadline.value,
    anon: anon.checked, dir: audDir.checked, questions: qList.map(readQ) }), dLabel);
  S.flush = saveDraft.flush;
  const draft = draftLoad(dKey);
  let dNote = null;
  if (draft) {
    const d = draft.v;
    title.value = d.title || ''; desc.value = d.desc || ''; deadline.value = d.deadline || '';
    if (!edit) { anon.checked = !!d.anon; named.checked = !d.anon; audDir.checked = !!d.dir; audAll.checked = !d.dir; }
    (d.questions || []).forEach(x => addQ(x));
    dNote = h('div', { class: 'ok' }, '前回の' + (edit ? '修正' : '作成') + '途中の内容(' + fmtTime(draft.t) + ' 保存)を復元しました。' + (edit ? '' : '対象者・管理者は選び直してください。'),
      h('div', { style: 'margin-top:6px' }, h('button', { class: 'ghost small', onclick: () => {
        if (!confirm(edit ? '修正途中の内容をすべて消して、今公開している内容に戻します。よろしいですか?' : '作成途中の内容をすべて消して、最初からやり直します。よろしいですか?')) return;
        saveDraft.cancel(); lsDel(dKey); edit ? adminEdit(edit) : adminCreate();
      } }, edit ? '下書きを消して元に戻す' : '下書きを消して最初から')));
  } else if (edit) {
    edit.questions.forEach(x => addQ(x));
  }
  if (!qList.length) addQ();

  saveBtn.addEventListener('click', () => {
    setMsg(box, null);
    const all = isAll();
    const qs = qList.map(readQ);
    if (qs.length && qs.every(q => q.hidden)) return setMsg(box, errBox('すべての設問が「非表示」になっています。少なくとも1問は表示してください。'));
    if (!(all && audDir.checked) && qs.some(q => !q.hidden) && qs.filter(q => !q.hidden).every(q => q.directorOnly)) {
      return setMsg(box, errBox('表示する設問がすべて「園長だけに聞く」になっています。' + (all ? '回答者を「園長のみ」にしてください。' : '園長以外にも聞く設問を1問以上入れてください。')));
    }
    if (edit) {
      // 回答がある設問の選択肢を消していないか(GAS側でも確認する)
      for (let i = 0; i < qs.length; i++) {
        const prev = qs[i].id && answered.has(qs[i].id) ? prevById[qs[i].id] : null;
        if (!prev) continue;
        const now = qs[i].options.map(o => o.trim());
        const missing = (prev.options || []).filter(o => now.indexOf(o) < 0);
        if (missing.length && prev.type !== 'scale' && prev.type !== 'text') {
          return setMsg(box, errBox('設問 ' + (i + 1) + ' の選択肢「' + missing.join('」「') + '」は、すでに回答があるため消せません。'));
        }
      }
      return withBusy(saveBtn, call('adminUpdateSurvey', S.ad.cred, edit.surveyId,
        { title: title.value, description: desc.value, deadline: deadline.value, questions: qs }).then(() => {
        saveDraft.cancel(); lsDel(dKey);
        S.ad.notice = '「' + title.value.trim() + '」の内容を修正しました。';
        adminMain();
      }).catch(e => setMsg(box, errBox(e.message))));
    }
    const sv = {
      title: title.value, description: desc.value, deadline: deadline.value, anonymous: anon.checked,
      scope: all ? 'ALL' : '',
      audience: all && audDir.checked ? 'director' : '',
      managerIds: all ? [] : mgrPicks.filter(p => p.cb.checked).map(p => p.s.staffId),
      targets: (all || (picks.length && picks.every(p => p.cb.checked))) ? 'all' : picks.filter(p => p.cb.checked).map(p => p.s.staffId),
      questions: qs,
    };
    const meOff = mgrMeOff();
    if (meOff && !confirm('あなた(作成者)が管理者に入っていません。作成後、あなたはこのアンケートの進捗・結果を見られなくなります。このまま作成しますか?')) return;

// 'yyyy-MM-dd HH:mm:ss' → '10月24日'
function fmtMD(t) {
  const m = String(t || '').match(/^\d{4}-(\d{2})-(\d{2})/);
  return m ? Number(m[1]) + '月' + Number(m[2]) + '日' : '';
}
// 'yyyy-MM-dd HH:mm:ss' → '10/24 15:30'
function fmtMDHM(t) {
  const m = String(t || '').match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  return m ? Number(m[1]) + '/' + Number(m[2]) + ' ' + m[3] + ':' + m[4] : '';
}

// 職員の一覧画面に出す「提出物」(自分の状況だけ。他の職員の状況やメモは届かない)
// ログイン後の画面の「提出物」。まだ受け取ってもらっていないものだけを出す。
// 回答待ちのアンケートも提出物もなければ「対応が必要なものはありません」を出す(surveyCount: 回答待ちアンケートの件数)
function staffTodoCards(surveyCount) {
  // 提出物: まだ受け取ってもらっていないものだけ(受け取られたら消える)
  const pend = (S.st.collections || []).filter(c => !c.receivedAt);
  const pendCard = pend.length ? h('div', { class: 'card' },
    h('h2', {}, '提出物(' + pend.length + '件)'),
    h('div', { class: 'sub' }, 'まだ提出していないものです。担当者が受け取ると、ここから消えます。'),
    pend.map(c => h('div', { class: 'srow' },
      h('div', { class: 'srow-main' },
        h('div', {}, c.allOrg ? h('span', { class: 'tag lav' }, '全園共通') : null, h('b', {}, c.title)),
        c.deadline ? h('div', { class: 'sub' }, '提出期限 ' + fmtDate(c.deadline)) : null,
        c.description ? h('div', { class: 'sub', style: 'white-space:pre-wrap' }, c.description) : null),
      h('span', { class: 'tag warn srow-st' }, '未提出')))) : null;
  // 担当している仕事(進み具合・チェック・締め切りなど)は、上の「自分が担当している管理」ボタンから開く。
  // ここには自分がまだやっていないこと(未回答・未提出)だけを出す
  const emptyCard = !surveyCount && !pend.length
    ? h('div', { class: 'card center' }, h('h2', {}, '対応が必要なものはありません'), h('div', { class: 'sub' }, '画面を閉じて大丈夫です。'))
    : null;
  return h('div', {}, pendCard, emptyCard);
}

// ---- 回収メモの作成 ----
function collectionCreate() {
  S.ad.tab = 'collections';
  const isAll = !!S.ad.hq || (S.ad.admin && S.ad.createScope === 'ALL');
  const me = S.ad.admin ? '' : S.ad.cred.staffId;
  const title = h('input', { type: 'text', maxlength: '100', placeholder: '例: 健康診断書の提出' });
  const desc = h('textarea', { placeholder: '説明(任意)。例: 原本を事務所の箱に入れてください', style: 'min-height:70px' });
  const deadline = h('input', { type: 'date' });
  const audAll = h('input', { type: 'radio', name: 'caud', value: '', checked: true });
  const audDir = h('input', { type: 'radio', name: 'caud', value: 'director' });
  const box = h('div');
  let picks = [], mgrPicks = [];
  const counter = h('span', { class: 'sub' });
  const mgrCounter = h('span', { class: 'sub' });
  const tgtList = h('div', {}, h('div', { class: 'sub' }, '読み込み中…'));
  const mgrList = h('div', {}, h('div', { class: 'sub' }, '読み込み中…'));
  const mgrWarn = h('div');
  function updateCount() { counter.textContent = picks.filter(p => p.cb.checked).length + ' / ' + picks.length + '人を選択中'; }
  function setAll(v) { picks.forEach(p => { p.cb.checked = v; }); updateCount(); }
  function meOff() { return !!me && mgrPicks.some(p => p.s.staffId === me && !p.cb.checked); }
  function updateMgr() {
    const n = mgrPicks.filter(p => p.cb.checked).length;
    mgrCounter.textContent = n ? n + '人を選択中' : '選択なし(園長だけがチェックします)';
    setMsg(mgrWarn, meOff() ? h('div', { class: 'note' }, 'あなた(作成者)を外しています。作成後、あなたはこの回収メモを見たりチェックしたりできなくなります(代理で作成するとき向け)。') : null);
  }
  if (!isAll) call('adminGetStaff', S.ad.cred).then(list => {
    const act = list.filter(s => s.active);
    // 担当者: 作成者には最初からチェック。代理で作成する場合は外せる
    mgrPicks = act.map(s => ({ s: s, cb: h('input', { type: 'checkbox', checked: s.staffId === me, onchange: updateMgr }) }));
    mgrList.replaceChildren(...mgrPicks.map(p => h('label', { class: 'opt' }, p.cb, h('span', {}, p.s.name, p.s.staffId === me ? h('span', { class: 'sub' }, '(あなた・作成者)') : null))));
    updateMgr();
    picks = act.map(s => ({ s: s, cb: h('input', { type: 'checkbox', checked: true, onchange: updateCount }) }));
    if (!picks.length) return tgtList.replaceChildren(h('div', { class: 'err' }, '職員が登録されていません。先に「職員」タブで登録してください。'));
    tgtList.replaceChildren(...picks.map(p => h('label', { class: 'opt' }, p.cb, h('span', {}, p.s.name))));
    updateCount();
  }).catch(e => tgtList.replaceChildren(errBox(e.message)));

  const back = () => (S.ad.createFrom === 'staff' ? staffLoadList : adminMain)();
  const saveBtn = h('button', { class: 'block' }, '作成する');
  saveBtn.addEventListener('click', () => {
    setMsg(box, null);
    if (!title.value.trim()) return setMsg(box, errBox('タイトルを入力してください。'));
    if (!isAll && picks.length && !picks.some(p => p.cb.checked)) return setMsg(box, errBox('対象の職員を1人以上選んでください。'));
    if (meOff() && !confirm('あなた(作成者)が担当者に入っていません。作成後、あなたはこの回収メモを管理できなくなります。このまま作成しますか?')) return;
    const x = {
      title: title.value, description: desc.value, deadline: deadline.value,
      scope: isAll ? 'ALL' : '', audience: isAll && audDir.checked ? 'director' : '',
      managerIds: isAll ? [] : mgrPicks.filter(p => p.cb.checked).map(p => p.s.staffId),
      targets: (isAll || (picks.length && picks.every(p => p.cb.checked))) ? 'all' : picks.filter(p => p.cb.checked).map(p => p.s.staffId),
    };
    withBusy(saveBtn, call('adminCreateCollection', S.ad.cred, x).then(r => {
      const info = { collectionId: r.collectionId, title: x.title.trim(), description: x.description.trim(), deadline: x.deadline, audience: x.audience };
      // 自分を外した職員は、作成後この回収メモを開けない。依頼文だけ出して回答画面に戻れるようにする
      if (meOff()) {
        S.st.notice = '「' + info.title + '」を作成しました(担当者ではないため、あなたの管理画面には表示されません)。';
        return collectionShareText(info, staffLoadList);
      }
      S.ad.notice = '「' + info.title + '」を作成しました。';
      collectionShareText(info, adminMain);
    }).catch(e => setMsg(box, errBox(e.message))));
  });

  const targetCard = h('div', { class: 'card' },
    h('h2', {}, '対象者'),
    h('div', { class: 'sub' }, '提出してもらう職員を選びます。選ばれた職員の画面に「提出物」として表示されます。'),
    h('div', { class: 'row', style: 'margin:10px 0' },
      h('button', { class: 'small', onclick: () => setAll(true) }, '全員を選択'),
      h('button', { class: 'ghost small', onclick: () => setAll(false) }, '全員を外す'), counter),
    tgtList);
  const mgrCard = h('div', { class: 'card' },
    h('h2', {}, '担当者(受け取ってチェックする人)'),
    h('div', { class: 'sub' }, '提出物を受け取り、チェックやメモを付けられる職員を選びます。何人でも選べます。園長は、選ばなくても常にチェックできます。'),
    me ? h('div', { class: 'sub' }, 'あなた(作成者)には最初からチェックが入っています。代理で作成するときは外せます。') : null,
    h('div', { class: 'row', style: 'margin:10px 0' }, mgrCounter), mgrWarn, mgrList);
  const allCard = h('div', { class: 'card' },
    h('h2', {}, '対象者と公開範囲'),
    h('label', { class: 'opt' }, audAll, h('span', {}, h('b', {}, '全園の全職員'), h('div', { class: 'sub' }, '全園すべての職員が対象です。'))),
    h('label', { class: 'opt' }, audDir, h('span', {}, h('b', {}, '園長のみ'), h('div', { class: 'sub' }, '各園の「職員」タブで「園長」に設定された人だけが対象です。'))),
    h('div', { class: 'sub', style: 'margin-top:8px' }, '各園の園長と統括が、全園分の状況を見てチェックできます。締め切り・削除は、作成した人と統括が行えます。'));

  show(h('button', { class: 'ghost small', onclick: back }, '← 戻る'),
    h('h1', {}, isAll ? '全園共通の回収メモを作成' : '回収メモを作成'),
    isAll ? h('div', { class: 'tag lav' }, '全園共通') : (S.ad.admin ? h('div', { class: 'sub' }, S.ad.title + 'だけの回収メモです(他の園からは見えません)。') : null),
    h('div', { class: 'card' },
      h('label', { class: 'f' }, 'タイトル'), title,
      h('label', { class: 'f' }, '説明(任意)'), desc,
      h('label', { class: 'f' }, '提出期限(任意)'), deadline),
    isAll ? allCard : [targetCard, mgrCard],
    box, saveBtn);
}

    const onlyPend = h('input', { type: 'checkbox' });
    S.ad.cview = S.ad.cview || {};
    let scope = '';   // 全園共通: '' = 全園、それ以外は facilityId

    function scoped() { return scope ? people.filter(p => p.facilityId === scope) : people; }
    function drawProg() {
      const list = scoped();
      const n = list.filter(p => p.receivedAt).length;
      prog.replaceChildren(h('div', { class: 'prog' }, h('div', { class: 'bar' }, h('i', { style: 'width:' + (list.length ? Math.round(n * 100 / list.length) : 0) + '%' })),
        h('span', {}, n + '/' + list.length + '人 回収済み')));
    }
    function row(p) {
      const cb = h('input', { type: 'checkbox', checked: !!p.receivedAt });
      const st = h('span', { class: 'cstat' });
      const memo = h('input', { type: 'text', class: 'cmemo', maxlength: '200', placeholder: 'ひとことメモ(例: 来週持参、一部のみ)', value: p.memo });
      const memoMsg = h('span', { class: 'sub cmemo-msg' });
      const el = h('div', { class: 'crow' },
        h('label', { class: 'cchk' }, cb, h('span', { class: 'cname' }, p.name)),
        st, h('div', { class: 'cmemo-wrap' }, memo, memoMsg));
      function paint() {
        el.classList.toggle('got', !!p.receivedAt);
        cb.checked = !!p.receivedAt;
        st.textContent = p.saving ? (p.receivedAt ? '受取を記録中…' : '取り消し中…')
          : p.receivedAt ? fmtMDHM(p.receivedAt) + ' 受取(' + p.receivedBy + ')' : '未回収';
      }
      // チェックしたらすぐ色を変え、保存は後ろで進める(失敗したら元に戻す)
      cb.addEventListener('change', () => {
        const want = cb.checked;
        if (p.saving) { cb.checked = !want; return; }
        if (!want && !confirm(p.name + ' さんの「受取済み」を取り消します。よろしいですか?')) { cb.checked = true; return; }
        const prev = { at: p.receivedAt, by: p.receivedBy };
        p.saving = true;
        p.receivedAt = want ? (prev.at || 'saving') : ''; p.receivedBy = want ? prev.by : '';
        paint(); drawProg(); drawRemind();
        call('adminMarkCollection', S.ad.cred, c.collectionId, p.staffId, want).then(m => {
          p.saving = false; p.receivedAt = m.receivedAt; p.receivedBy = m.receivedBy;
          paint(); drawProg(); drawRemind();
          redrawSoon();   // 回収済みの人は下へ移動する(少し待ってから並べ直す)
        }).catch(e => {
          p.saving = false; p.receivedAt = prev.at; p.receivedBy = prev.by;
          paint(); drawProg(); drawRemind();
          setMsg(msg, errBox(p.name + ' さんの記録を保存できませんでした。もう一度チェックしてください(' + e.message + ')'));
        });
      });
      memo.addEventListener('change', () => {
        memoMsg.textContent = '保存中…';
        call('adminSetCollectionMemo', S.ad.cred, c.collectionId, p.staffId, memo.value).then(m => {
          p.memo = m.memo; memoMsg.textContent = '保存しました';
          setTimeout(() => { if (memoMsg.textContent === '保存しました') memoMsg.textContent = ''; }, 2000);
        }).catch(e => { memoMsg.textContent = ''; setMsg(msg, errBox(e.message)); });
      });
      memo.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) memo.blur(); });
      // 並べ直しで行が作り直されても、入力した内容が消えないようにする
      memo.addEventListener('input', () => { p.memo = memo.value; });
      paint();
      return el;
    }
    // 未回収の人を上、回収済みの人を下に並べる(それぞれの中は職員一覧の順)。
    // 回収済みの前に区切りの見出しを入れる
    function sortedRows(list) {
      const pend = list.filter(p => !p.receivedAt), got = list.filter(p => p.receivedAt);
      return pend.map(row).concat(got.length && !onlyPend.checked ? [h('div', { class: 'cdiv' }, '回収済み ' + got.length + '人')].concat(got.map(row)) : []);
    }
    function drawList() {
      const list = scoped().filter(p => !onlyPend.checked || !p.receivedAt);
      if (!list.length) return listBox.replaceChildren(h('div', { class: 'sub', style: 'padding:10px 4px' }, onlyPend.checked ? '未回収の人はいません。' : '対象の職員がいません。'));
      if (c.all && !scope) {
        // 全園: 園ごとに見出しを付ける
        listBox.replaceChildren(...d.facilities.map(f => {
          const fl = list.filter(p => p.facilityId === f.facilityId);
          return fl.length ? [h('h3', {}, f.name)].concat(sortedRows(fl)) : null;
        }).filter(Boolean).flat());
      } else {
        listBox.replaceChildren(...sortedRows(list));
      }
    }
    // チェック直後にすぐ動くと押し間違えやすいので、少し待ってから並べ直す。
    // メモを入力中のときは、入力が終わる(枠の外を押す)まで待つ
    let redrawTimer = 0;
    function redrawSoon() {
      clearTimeout(redrawTimer);
      redrawTimer = setTimeout(() => {
        const a = document.activeElement;
        if (a && a.classList && a.classList.contains('cmemo') && listBox.contains(a)) {
          a.addEventListener('blur', () => setTimeout(redrawSoon, 0), { once: true });
          return;
        }
        drawList();
      }, 700);
    }
    function drawRemind() {
      const groups = c.all && !scope ? d.facilities.map(f => ({ name: f.name, list: people.filter(p => p.facilityId === f.facilityId) }))
        : [{ name: '', list: scoped() }];
      const lines = groups.map(g => ({ name: g.name, pend: g.list.filter(p => !p.receivedAt).map(p => p.name) }))
        .filter(g => g.pend.length).map(g => (c.all ? g.name.replace('こども保育園', '') + ': ' : '') + g.pend.join('、'));
      if (!lines.length) return remindBox.replaceChildren(h('div', { class: 'ok' }, '全員分を回収済みです。'));
      const text = '【提出のお願い】\n' + c.title + '\n' + (c.deadline ? '提出期限: ' + fmtDate(c.deadline) + '\n' : '')
        + '\nまだ受け取っていない方がいます。お手数ですが、担当者に提出をお願いします。\n\n未提出:\n' + lines.join('\n');
      remindBox.replaceChildren(...[h('b', {}, 'Chatwork用の催促文'),
        c.all && !scope ? h('div', { class: 'sub' }, '上で園を選ぶと、その園の未提出者だけの催促文になります。') : null,
        copyBox(text, 'コピー')].filter(Boolean));
    }
    function csv() {
      const head = ['名前'].concat(c.all ? ['園'] : [], ['状態', '受取日時', '受取者', 'メモ']);
      const rows = [head].concat(people.map(p => [p.name].concat(c.all ? [p.facility] : [],
        [p.receivedAt ? '回収済み' : '未回収', p.saving ? '' : p.receivedAt, p.receivedBy, p.memo])));
      return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    }
    onlyPend.addEventListener('change', drawList);

    let tabBar = null;
    if (c.all) {
      const keys = [['', '全園']].concat(d.facilities.map(f => [f.facilityId, f.name.replace('こども保育園', '')]));
      const btns = keys.map(k => h('button', { onclick: () => select(k[0]) }, k[1]));
      tabBar = h('div', { class: 'tabs' }, btns);
      var select = key => {
        scope = key;
        btns.forEach((b, i) => { b.className = keys[i][0] === key ? 'on' : ''; });
        drawProg(); drawList(); drawRemind();
      };
    }
    const dlMsg = h('span', { class: 'sub' });
    const fname = (c.title.replace(/[\\/:*?"<>|.\s]+/g, '_').slice(0, 40) || '回収メモ') + '_回収状況.csv';
    show(back,
      h('div', { style: 'margin-top:8px' }, c.all ? h('span', { class: 'tag lav' }, '全園共通') : null, audienceTag(c),
        h('span', { class: 'tag ' + (c.open ? '' : 'warn') }, c.open ? '回収中' : '締め切り済み')),
      h('h1', {}, c.title),
      h('div', { class: 'sub' }, '提出期限: ' + fmtDate(c.deadline)),
      c.description ? h('div', { class: 'sub', style: 'white-space:pre-wrap' }, c.description) : null,
      tabBar,
      h('div', { class: 'card' },
        prog,
        h('div', { class: 'row between', style: 'margin-top:10px' },
          h('label', { style: 'font-size:14px' }, onlyPend, ' 未回収の人だけ表示'),
          h('span', { class: 'sub' }, '受け取ったらチェック。メモは入力して枠の外を押すと保存されます。')),
        msg, listBox),
      h('div', { class: 'card' }, remindBox),
      h('div', { class: 'card' }, h('div', { class: 'row' },
        h('button', { class: 'small', onclick: () => {
          try { downloadCsv(fname, csv()); dlMsg.textContent = 'ダウンロードしました(' + fname + ')'; }
          catch (e) { dlMsg.textContent = 'ダウンロードできませんでした。'; }
        } }, 'CSVをダウンロード'), dlMsg)));
    if (c.all) select(''); else { drawProg(); drawList(); drawRemind(); }
  }).catch(e => show(back, errBox(e.message)));
}

const WD = '日月火水木金土';
// 日本の祝日(振替休日・国民の休日を含む)。'月-日' → 祝日名
function jpHolidays(y) {
  const H = {};
  const set = (m, d, n) => { H[m + '-' + d] = n; };
  const mon = (m, n) => 1 + ((8 - new Date(y, m - 1, 1).getDay()) % 7) + (n - 1) * 7;   // m月の第n月曜日
  const eq = base => Math.floor(base + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));   // 春分・秋分(2099年まで有効)
  set(1, 1, '元日'); set(1, mon(1, 2), '成人の日'); set(2, 11, '建国記念の日'); set(2, 23, '天皇誕生日');
  set(3, eq(20.8431), '春分の日'); set(4, 29, '昭和の日'); set(5, 3, '憲法記念日'); set(5, 4, 'みどりの日');
  set(5, 5, 'こどもの日'); set(7, mon(7, 3), '海の日'); set(8, 11, '山の日'); set(9, mon(9, 3), '敬老の日');
  set(9, eq(23.2488), '秋分の日'); set(10, mon(10, 2), 'スポーツの日'); set(11, 3, '文化の日'); set(11, 23, '勤労感謝の日');
  const key = t => (t.getMonth() + 1) + '-' + t.getDate();
  // 振替休日: 祝日が日曜日なら、その後の最初の祝日でない日
  Object.keys(H).forEach(k => {
    const [m, d] = k.split('-').map(Number);
    if (new Date(y, m - 1, d).getDay() !== 0) return;
    const t = new Date(y, m - 1, d + 1);
    while (H[key(t)]) t.setDate(t.getDate() + 1);
    if (t.getFullYear() === y) H[key(t)] = '振替休日';
  });
  // 国民の休日: 前日と翌日が祝日の平日
  for (let t = new Date(y, 0, 2); t.getFullYear() === y; t.setDate(t.getDate() + 1)) {
    const p = new Date(t); p.setDate(t.getDate() - 1);
    const n = new Date(t); n.setDate(t.getDate() + 1);
    if (!H[key(t)] && t.getDay() !== 0 && H[key(p)] && H[key(n)]) H[key(t)] = '国民の休日';
  }
  return H;
}
// 'yyyy-MM' の日付一覧を作る。日曜・祝日は休園日にして、祝日名を行事欄に入れておく
function shiftGenDays(month) {
  const [y, m] = month.split('-').map(Number);
  const hol = jpHolidays(y);
  const n = new Date(y, m, 0).getDate();
  const out = [];
  for (let d = 1; d <= n; d++) {
    const name = hol[m + '-' + d] || '';
    out.push({ d: d, closed: !!name || new Date(y, m - 1, d).getDay() === 0, note: name });
  }
  return out;
}
function shiftWd(month, d) { const [y, m] = month.split('-').map(Number); return new Date(y, m - 1, d).getDay(); }
function shiftMonthLabel(month) { const [y, m] = month.split('-').map(Number); return y + '年' + m + '月'; }
// 日付の見出し(例: 3日(火)) / 休園日・日曜は赤、土曜は青
function shiftDayLabel(month, d) {
  const wd = shiftWd(month, d.d);
  return [d.d + '日', h('span', { class: 'wd' + (wd === 6 ? ' sat' : '') + (wd === 0 || d.closed ? ' sun' : '') }, '(' + WD[wd] + ')')];
}
const SHIFT_DEFAULT_OPTIONS = [
  { label: '×', code: '×', color: 'pink' }, { label: '有', code: '有', color: 'green' }, { label: '午前半休', code: '前半', color: 'blue' },
  { label: '午後半休', code: '後半', color: 'lav' }, { label: '夏季休暇', code: '夏季', color: 'orange' }];
// 選択肢の色(職員のボタン・集計の表で使う)。色を決めていない選択肢は、並び順で自動で付ける
const SHIFT_COLORS = {
  pink: { name: 'ピンク', bg: '#ffdfe0', ink: '#a4404f', line: '#f2a7b0' },
  green: { name: 'みどり', bg: '#dcf2e6', ink: '#2d6a4a', line: '#8fc9b6' },
  blue: { name: '水色', bg: '#dceefc', ink: '#2f5878', line: '#8fc0ea' },
  lav: { name: 'むらさき', bg: '#ebe6fb', ink: '#4a3f85', line: '#bdb2ee' },
  orange: { name: 'オレンジ', bg: '#ffe4d1', ink: '#9a4f2c', line: '#f4b48c' },
  yellow: { name: 'きいろ', bg: '#fff2bf', ink: '#7a6330', line: '#e8cf72' },
  teal: { name: '青緑', bg: '#d6f1ef', ink: '#1f6b66', line: '#8ccfc8' },
  gray: { name: 'グレー', bg: '#ececf1', ink: '#5b5870', line: '#c9c7d3' },
};
function shiftColor(o, i) { const keys = Object.keys(SHIFT_COLORS); return SHIFT_COLORS[o.color] || SHIFT_COLORS[keys[i % keys.length]]; }
function shiftColorStyle(c) { return 'background:' + c.bg + ';color:' + c.ink + ';border-color:' + c.line; }
// 選択肢ごとの日数を色付きの小さなラベルで並べる(ids: 選んだ選択肢idの配列)。0日の選択肢は出さない(all なら出す)
function shiftCountChips(options, ids, all) {
  return h('span', { class: 'scnt' }, options.map((o, i) => {
    const n = ids.filter(x => x === o.id).length;
    return n || all ? h('span', { class: 'scnt-c', style: shiftColorStyle(shiftColor(o, i)) }, o.label + ' ' + n) : null;
  }));
}
const SHIFT_DEFAULT_DESC = 'シフト希望の提出をお願いします。\n確定シフト通知:毎月20日までに確定シフトをお知らせします。\n\n'
  + 'ルール\n・休み希望は「×」を選んでください。\n・半休の場合は「その他希望・連絡」の欄に何番希望かを記載してください。\n'
  + '・その他、選択肢にないものは「その他希望・連絡」に記載してください。\n'
  + '・パートの方の細かいシフト希望に関しては「その他希望・連絡」に記載してください。\n'
  + '・希望がある日以外は選ばないでください。「1番多め」などその日に限定しない場合には「その他希望・連絡」に記載してください。\n\n'
  + 'シフト希望に関する説明\n・×…休み希望\n・有…有給';
